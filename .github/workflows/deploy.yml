name: Deploy game to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Also prepare as index.html
        run: cp mario-game.html index.html

      - name: Copy project to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "*.html,assets/**"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Run post-deploy command (optional)
        if: ${{ vars.POST_DEPLOY_CMD != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: ${{ vars.POST_DEPLOY_CMD }}

      - name: List server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "--- home dir ---"
            pwd
            ls -la ~
            echo "--- /srv/www ---"
            ls -la /srv/www 2>/dev/null || echo "no access to /srv/www"
            echo "--- deploy path ---"
            ls -la "${{ secrets.DEPLOY_PATH }}"
