<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Mahsa Bros</title>
<style>
  :root {
    --sky: #5c94fc;
    --ground: #8b4513;
    --grass: #3a9d23;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100%;
    font-family: 'Courier New', monospace;
    color: #fff;
    touch-action: manipulation;
  }
  #wrap {
    text-align: center;
    max-width: 900px;
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    margin-bottom: 6px;
    text-shadow: 2px 2px #000;
    flex-wrap: wrap;
    gap: 4px;
  }
  #hud .stat { margin: 0 6px; white-space: nowrap; }
  #canvasWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }
  canvas {
    background: var(--sky);
    border: 4px solid #222;
    image-rendering: pixelated;
    width: 100%;
    height: auto;
    display: block;
    outline: none;
  }
  canvas:focus-visible {
    outline: 3px solid #ffd700;
  }
  #msg {
    font-size: 15px;
    margin-top: 8px;
    text-shadow: 1px 1px #000;
    min-height: 20px;
  }
  .btnRow {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    background: #222;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: #444; outline: 2px solid #ffd700; }
  button[aria-pressed="true"] { background: #3a9d23; border-color: #3a9d23; }
  /* touch controls */
  #touchControls {
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 10px;
    user-select: none;
  }
  #touchControls.active { display: flex; }
  .padBtn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid #fff;
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .padGroup { display: flex; gap: 10px; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
  .highContrast canvas { filter: contrast(1.3) saturate(1.4); }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="sr-only">Super Mahsa Bros - a platformer game</h1>
  <div id="hud">
    <span class="stat">Score: <span id="score">0</span></span>
    <span class="stat">Coins: <span id="coins">0</span></span>
    <span class="stat">Lives: <span id="lives">3</span></span>
    <span class="stat">Level: <span id="levelNum">1</span>/<span id="levelTotal">3</span></span>
    <span class="stat">Best: <span id="best">0</span></span>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="800" height="400" tabindex="0" role="img" aria-label="Game viewport. Use arrow keys or A/D to move, Space to jump, P to pause."></canvas>
  </div>
  <div id="msg" aria-live="polite">Loading...</div>
  <div class="btnRow">
    <button id="btnPause" aria-pressed="false">Pause (P)</button>
    <button id="btnMute" aria-pressed="false">Mute (M)</button>
    <button id="btnContrast" aria-pressed="false">High Contrast (C)</button>
    <button id="btnTouch" aria-pressed="false">Show Touch Controls</button>
    <label for="difficulty" class="sr-only">Difficulty</label>
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div id="touchControls">
    <div class="padGroup">
      <button class="padBtn" id="padLeft" aria-label="Move left">&#8592;</button>
      <button class="padBtn" id="padRight" aria-label="Move right">&#8594;</button>
    </div>
    <button class="padBtn" id="padJump" aria-label="Jump">&#8593;</button>
  </div>
  <div id="liveAnnouncer" class="sr-only" aria-live="assertive"></div>
</div>
<script>
(function() {
  'use strict';

  // ---------------------------------------------------------------------
  // Canvas / DOM setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const livesEl = document.getElementById('lives');
  const levelNumEl = document.getElementById('levelNum');
  const levelTotalEl = document.getElementById('levelTotal');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const announcer = document.getElementById('liveAnnouncer');
  const btnPause = document.getElementById('btnPause');
  const btnMute = document.getElementById('btnMute');
  const btnContrast = document.getElementById('btnContrast');
  const btnTouch = document.getElementById('btnTouch');
  const touchControls = document.getElementById('touchControls');
  const difficultySel = document.getElementById('difficulty');

  function announce(text) {
    msgEl.textContent = text;
    announcer.textContent = text;
  }

  // ---------------------------------------------------------------------
  // Config / constants
  // ---------------------------------------------------------------------
  const GROUND_Y = 360;
  const CANVAS_W = 800;
  const CANVAS_H = 400;

  const DIFFICULTY = {
    easy:   { lives: 5, enemySpeedMul: 0.75, gravity: 0.55 },
    normal: { lives: 3, enemySpeedMul: 1,    gravity: 0.6 },
    hard:   { lives: 2, enemySpeedMul: 1.35, gravity: 0.68 },
  };

  const STORAGE_KEY = 'superMahsaBros.save.v1';

  function loadSave() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { bestScore: 0, difficulty: 'normal', muted: false, highContrast: false };
      const parsed = JSON.parse(raw);
      return Object.assign({ bestScore: 0, difficulty: 'normal', muted: false, highContrast: false }, parsed);
    } catch (e) {
      return { bestScore: 0, difficulty: 'normal', muted: false, highContrast: false };
    }
  }

  function persistSave() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    } catch (e) { /* storage unavailable (private mode / quota) - fail silently, non-critical */ }
  }

  const save = loadSave();
  difficultySel.value = save.difficulty;

  // ---------------------------------------------------------------------
  // Audio (synthesized with Web Audio API - no external assets needed)
  // ---------------------------------------------------------------------
  const Audio1 = (function() {
    let actx = null;
    let muted = save.muted;
    let musicTimer = null;
    let musicStep = 0;

    function ctxReady() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function tone(freq, start, dur, type, gainPeak, opts) {
      const ac = ctxReady();
      if (!ac || muted) return;
      opts = opts || {};
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, ac.currentTime + start);
      if (opts.slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.slideTo), ac.currentTime + start + dur);
      }
      gain.gain.setValueAtTime(0.0001, ac.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(gainPeak, ac.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(ac.currentTime + start);
      osc.stop(ac.currentTime + start + dur + 0.02);
    }

    function jump() { tone(440, 0, 0.18, 'square', 0.18, { slideTo: 880 }); }
    function coin() {
      tone(988, 0, 0.09, 'square', 0.15);
      tone(1319, 0.07, 0.14, 'square', 0.15);
    }
    function stomp() { tone(180, 0, 0.12, 'square', 0.2, { slideTo: 60 }); }
    function hurt() { tone(220, 0, 0.25, 'sawtooth', 0.18, { slideTo: 80 }); }
    function powerup() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.1, 'square', 0.16));
    }
    function gameover() {
      [392, 349, 330, 262].forEach((f, i) => tone(f, i * 0.18, 0.22, 'triangle', 0.2));
    }
    function win() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.12, 0.18, 'square', 0.2));
    }
    function levelComplete() {
      [659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.15, 'square', 0.18));
    }

    const MELODY = [262, 294, 330, 294, 262, 0, 330, 349, 392, 349, 330, 294, 262, 0, 0, 0];
    function startMusic() {
      stopMusic();
      musicStep = 0;
      musicTimer = setInterval(() => {
        const ac = ctxReady();
        if (!ac || muted) return;
        const note = MELODY[musicStep % MELODY.length];
        if (note > 0) tone(note, 0, 0.18, 'triangle', 0.05);
        musicStep++;
      }, 220);
    }
    function stopMusic() {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    function setMuted(v) { muted = v; if (muted) stopMusic(); }
    function isMuted() { return muted; }
    function unlock() { ctxReady(); }

    return { jump, coin, stomp, hurt, powerup, gameover, win, levelComplete, startMusic, stopMusic, setMuted, isMuted, unlock };
  })();

  // ---------------------------------------------------------------------
  // Particles (visual feedback / "juice")
  // ---------------------------------------------------------------------
  let particles = [];
  function spawnParticles(x, y, count, color, opts) {
    opts = opts || {};
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (opts.speed || 2) + Math.random() * (opts.speedVar || 2);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (opts.upBias || 0),
        life: opts.life || 0.5,
        maxLife: opts.life || 0.5,
        color,
        size: opts.size || 3,
      });
    }
  }
  function updateParticles(dt) {
    particles.forEach(p => {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 0.15 * dt * 60;
      p.life -= dt;
    });
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------
  // Screen shake
  // ---------------------------------------------------------------------
  let shake = 0;
  function addShake(amount) { shake = Math.min(12, shake + amount); }

  // ---------------------------------------------------------------------
  // Input (keyboard + touch)
  // ---------------------------------------------------------------------
  const keys = {};
  const touchState = { left: false, right: false, jump: false };

  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    Audio1.unlock();
    if (keys[e.code]) return;
    keys[e.code] = true;
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') toggleMute();
    if (e.code === 'KeyC') toggleContrast();
    if (e.code === 'KeyR') { if (state === STATE.GAMEOVER || state === STATE.COMPLETE) startNewGame(); }
    if (e.code === 'Enter' || e.code === 'Space') { if (state === STATE.START) beginPlaying(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchState.left = touchState.right = touchState.jump = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const k in keys) keys[k] = false; if (state === STATE.PLAYING) togglePause(true); }
  });

  function bindHold(el, onDown, onUp) {
    const down = ev => { ev.preventDefault(); Audio1.unlock(); onDown(); };
    const up = ev => { ev.preventDefault(); onUp(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  bindHold(document.getElementById('padLeft'), () => touchState.left = true, () => touchState.left = false);
  bindHold(document.getElementById('padRight'), () => touchState.right = true, () => touchState.right = false);
  bindHold(document.getElementById('padJump'), () => touchState.jump = true, () => touchState.jump = false);

  function isLeft() { return keys['ArrowLeft'] || keys['KeyA'] || touchState.left; }
  function isRight() { return keys['ArrowRight'] || keys['KeyD'] || touchState.right; }
  function isJumpPressed() { return keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchState.jump; }

  // auto-show touch controls on coarse pointers (phones/tablets)
  let touchControlsVisible = false;
  function setTouchControls(v) {
    touchControlsVisible = v;
    touchControls.classList.toggle('active', v);
    btnTouch.setAttribute('aria-pressed', String(v));
  }
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) setTouchControls(true);
  btnTouch.addEventListener('click', () => setTouchControls(!touchControlsVisible));

  // ---------------------------------------------------------------------
  // Collision helpers
  // ---------------------------------------------------------------------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------------------------------------------------------------------
  // Level definitions (3 levels, increasing difficulty & verticality)
  // ---------------------------------------------------------------------
  function levelDefs() {
    return [
      // Level 1: introductory, gentle
      {
        width: 3200,
        theme: '#5c94fc',
        platforms: [
          { x: 0, y: GROUND_Y, w: 900, h: 40 },
          { x: 980, y: GROUND_Y, w: 500, h: 40 },
          { x: 1560, y: GROUND_Y, w: 700, h: 40 },
          { x: 2340, y: GROUND_Y, w: 860, h: 40 },
          { x: 300, y: 280, w: 100, h: 20 },
          { x: 500, y: 220, w: 100, h: 20 },
          { x: 1100, y: 260, w: 120, h: 20 },
          { x: 1700, y: 260, w: 120, h: 20 },
          { x: 1900, y: 200, w: 120, h: 20 },
          { x: 2500, y: 260, w: 140, h: 20 },
        ],
        coins: [
          {x: 340, y: 240}, {x: 540, y: 180}, {x: 1140, y: 220},
          {x: 1740, y: 220}, {x: 1940, y: 160}, {x: 2540, y: 220},
          {x: 700, y: 320}, {x: 1400, y: 320}, {x: 2100, y: 320},
        ],
        enemies: [
          { type: 'goomba', x: 500, y: GROUND_Y - 28, dir: -1, minX: 400, maxX: 850 },
          { type: 'goomba', x: 1200, y: GROUND_Y - 28, dir: 1, minX: 1050, maxX: 1450 },
          { type: 'goomba', x: 1900, y: GROUND_Y - 28, dir: -1, minX: 1650, maxX: 2200 },
          { type: 'goomba', x: 2600, y: GROUND_Y - 28, dir: 1, minX: 2400, maxX: 3100 },
        ],
        hazards: [],
        powerups: [ { x: 1150, y: 220, kind: 'shield' } ],
        flagX: 3100,
        spawnX: 50,
      },
      // Level 2: more verticality, a flyer, a spike hazard
      {
        width: 3600,
        theme: '#3a6bc9',
        platforms: [
          { x: 0, y: GROUND_Y, w: 500, h: 40 },
          { x: 620, y: GROUND_Y, w: 260, h: 40 },
          { x: 980, y: GROUND_Y, w: 240, h: 40 },
          { x: 1360, y: GROUND_Y, w: 500, h: 40 },
          { x: 2000, y: GROUND_Y, w: 300, h: 40 },
          { x: 2440, y: GROUND_Y, w: 260, h: 40 },
          { x: 2840, y: GROUND_Y, w: 760, h: 40 },
          { x: 200, y: 260, w: 90, h: 20 },
          { x: 700, y: 230, w: 90, h: 20 },
          { x: 900, y: 170, w: 90, h: 20 },
          { x: 1450, y: 250, w: 110, h: 20 },
          { x: 1650, y: 190, w: 110, h: 20 },
          { x: 2100, y: 240, w: 100, h: 20 },
          { x: 2500, y: 200, w: 100, h: 20 },
          { x: 3000, y: 260, w: 140, h: 20 },
          { x: 3250, y: 190, w: 100, h: 20 },
        ],
        coins: [
          {x: 230, y: 220}, {x: 730, y: 190}, {x: 930, y: 130}, {x: 1480, y: 210},
          {x: 1680, y: 150}, {x: 2130, y: 200}, {x: 2530, y: 160}, {x: 3030, y: 220},
          {x: 3280, y: 150}, {x: 560, y: 320},
        ],
        enemies: [
          { type: 'goomba', x: 680, y: GROUND_Y - 28, dir: 1, minX: 620, maxX: 860 },
          { type: 'goomba', x: 1450, y: GROUND_Y - 28, dir: -1, minX: 1370, maxX: 1820 },
          { type: 'bat', x: 2050, y: 220, dir: 1, minX: 2000, maxX: 2280, baseY: 220 },
          { type: 'goomba', x: 2900, y: GROUND_Y - 28, dir: 1, minX: 2850, maxX: 3550 },
          { type: 'bat', x: 3100, y: 180, dir: -1, minX: 2900, maxX: 3400, baseY: 180 },
        ],
        hazards: [
          { x: 940, y: GROUND_Y - 20, w: 40, h: 20 },
          { x: 2380, y: GROUND_Y - 20, w: 40, h: 20 },
        ],
        powerups: [ { x: 1670, y: 150, kind: 'star' }, { x: 2510, y: 160, kind: 'shield' } ],
        flagX: 3500,
        spawnX: 50,
      },
      // Level 3: gauntlet, tight platforming, more hazards & enemies
      {
        width: 4000,
        theme: '#20305c',
        platforms: [
          { x: 0, y: GROUND_Y, w: 400, h: 40 },
          { x: 500, y: GROUND_Y, w: 160, h: 40 },
          { x: 760, y: GROUND_Y, w: 160, h: 40 },
          { x: 1020, y: GROUND_Y, w: 160, h: 40 },
          { x: 1300, y: GROUND_Y, w: 400, h: 40 },
          { x: 1820, y: GROUND_Y, w: 160, h: 40 },
          { x: 2080, y: GROUND_Y, w: 160, h: 40 },
          { x: 2340, y: GROUND_Y, w: 160, h: 40 },
          { x: 2600, y: GROUND_Y, w: 500, h: 40 },
          { x: 3200, y: GROUND_Y, w: 160, h: 40 },
          { x: 3460, y: GROUND_Y, w: 160, h: 40 },
          { x: 3720, y: GROUND_Y, w: 280, h: 40 },
          { x: 150, y: 250, w: 90, h: 20 },
          { x: 600, y: 260, w: 80, h: 20 },
          { x: 900, y: 200, w: 80, h: 20 },
          { x: 1450, y: 260, w: 100, h: 20 },
          { x: 1650, y: 200, w: 100, h: 20 },
          { x: 1900, y: 260, w: 80, h: 20 },
          { x: 2180, y: 200, w: 80, h: 20 },
          { x: 2700, y: 250, w: 100, h: 20 },
          { x: 2900, y: 190, w: 100, h: 20 },
          { x: 3300, y: 260, w: 80, h: 20 },
          { x: 3550, y: 200, w: 80, h: 20 },
          { x: 3800, y: 250, w: 120, h: 20 },
        ],
        coins: [
          {x: 180, y: 210}, {x: 630, y: 220}, {x: 930, y: 160}, {x: 1480, y: 220},
          {x: 1680, y: 160}, {x: 1930, y: 220}, {x: 2210, y: 160}, {x: 2730, y: 210},
          {x: 2930, y: 150}, {x: 3330, y: 220}, {x: 3580, y: 160}, {x: 3830, y: 210},
        ],
        enemies: [
          { type: 'goomba', x: 520, y: GROUND_Y - 28, dir: 1, minX: 500, maxX: 650 },
          { type: 'goomba', x: 1320, y: GROUND_Y - 28, dir: 1, minX: 1300, maxX: 1680 },
          { type: 'bat', x: 1500, y: 240, dir: 1, minX: 1400, maxX: 1750, baseY: 240 },
          { type: 'goomba', x: 2620, y: GROUND_Y - 28, dir: 1, minX: 2600, maxX: 3080 },
          { type: 'bat', x: 2800, y: 200, dir: -1, minX: 2650, maxX: 3050, baseY: 200 },
          { type: 'goomba', x: 3740, y: GROUND_Y - 28, dir: 1, minX: 3720, maxX: 3980 },
          { type: 'bat', x: 3900, y: 210, dir: -1, minX: 3750, maxX: 3980, baseY: 210 },
        ],
        hazards: [
          { x: 660, y: GROUND_Y - 20, w: 40, h: 20 },
          { x: 1180, y: GROUND_Y - 20, w: 40, h: 20 },
          { x: 1980, y: GROUND_Y - 20, w: 40, h: 20 },
          { x: 3160, y: GROUND_Y - 20, w: 40, h: 20 },
          { x: 3420, y: GROUND_Y - 20, w: 40, h: 20 },
        ],
        powerups: [ { x: 1660, y: 160, kind: 'star' }, { x: 2910, y: 150, kind: 'shield' } ],
        flagX: 3900,
        spawnX: 50,
      },
    ];
  }

  function instantiateLevel(idx) {
    const def = levelDefs()[idx];
    return {
      width: def.width,
      theme: def.theme,
      platforms: def.platforms.map(p => ({...p})),
      coins: def.coins.map(c => ({...c, w: 20, h: 20, collected: false})),
      enemies: def.enemies.map(e => ({...e, w: 28, h: 28, alive: true, phase: Math.random() * Math.PI * 2})),
      hazards: def.hazards.map(h => ({...h})),
      powerups: def.powerups.map(p => ({...p, w: 24, h: 24, collected: false})),
      flag: { x: def.flagX, y: GROUND_Y - 200, w: 20, h: 200 },
      spawnX: def.spawnX,
    };
  }

  const LEVELS = levelDefs();
  levelTotalEl.textContent = LEVELS.length;

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  const STATE = { START: 'start', PLAYING: 'playing', PAUSED: 'paused', LEVEL_COMPLETE: 'levelcomplete', GAMEOVER: 'gameover', COMPLETE: 'complete' };
  let state = STATE.START;
  let diffKey = save.difficulty;
  let diff = DIFFICULTY[diffKey];

  let levelIndex = 0;
  let level = instantiateLevel(0);

  const player = {
    x: 50, y: GROUND_Y - 40, w: 28, h: 40,
    vx: 0, vy: 0, onGround: false, facing: 1,
    invuln: 0, shielded: false, star: 0,
    animTimer: 0, animFrame: 0,
  };

  let score = 0;
  let coinCount = 0;
  let lives = diff.lives;
  let camX = 0;

  bestEl.textContent = save.bestScore;

  function resetPlayer() {
    player.x = level.spawnX; player.y = GROUND_Y - 40;
    player.vx = 0; player.vy = 0; player.invuln = 60;
    camX = 0;
  }

  function loadLevel(idx) {
    levelIndex = idx;
    level = instantiateLevel(idx);
    levelNumEl.textContent = idx + 1;
    resetPlayer();
  }

  function startNewGame() {
    diffKey = difficultySel.value;
    diff = DIFFICULTY[diffKey];
    save.difficulty = diffKey;
    persistSave();
    score = 0; coinCount = 0; lives = diff.lives;
    player.shielded = false; player.star = 0;
    loadLevel(0);
    state = STATE.PLAYING;
    announce('Go! Arrow keys / A-D to move, Space to jump. Stomp goombas, dodge spikes, grab coins, reach the flag!');
    Audio1.startMusic();
  }

  function beginPlaying() {
    state = STATE.PLAYING;
    Audio1.startMusic();
    announce('Go! Arrow keys / A-D to move, Space to jump. Stomp goombas, dodge spikes, grab coins, reach the flag!');
  }

  function loseLife() {
    if (player.invuln > 0) return;
    lives--;
    Audio1.hurt();
    addShake(8);
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 12, '#e60000', { life: 0.4, speed: 3 });
    livesEl.textContent = lives;
    if (lives <= 0) {
      state = STATE.GAMEOVER;
      Audio1.stopMusic();
      Audio1.gameover();
      if (score > save.bestScore) { save.bestScore = score; persistSave(); bestEl.textContent = save.bestScore; }
      announce('Game Over! Final score ' + score + '. Press R to restart.');
    } else {
      resetPlayer();
      announce('Ouch! Lives remaining: ' + lives);
    }
  }

  function togglePause(forceOn) {
    if (state === STATE.PLAYING) { state = STATE.PAUSED; btnPause.setAttribute('aria-pressed', 'true'); announce('Paused. Press P to resume.'); }
    else if (state === STATE.PAUSED && !forceOn) { state = STATE.PLAYING; btnPause.setAttribute('aria-pressed', 'false'); announce('Resumed.'); }
  }
  btnPause.addEventListener('click', () => togglePause());

  function toggleMute() {
    const m = !Audio1.isMuted();
    Audio1.setMuted(m);
    save.muted = m;
    persistSave();
    btnMute.setAttribute('aria-pressed', String(m));
    btnMute.textContent = m ? 'Unmute (M)' : 'Mute (M)';
  }
  btnMute.addEventListener('click', toggleMute);
  if (save.muted) { Audio1.setMuted(true); btnMute.setAttribute('aria-pressed', 'true'); btnMute.textContent = 'Unmute (M)'; }

  function toggleContrast() {
    const on = !document.body.classList.contains('highContrast');
    document.body.classList.toggle('highContrast', on);
    save.highContrast = on;
    persistSave();
    btnContrast.setAttribute('aria-pressed', String(on));
  }
  btnContrast.addEventListener('click', toggleContrast);
  if (save.highContrast) { document.body.classList.add('highContrast'); btnContrast.setAttribute('aria-pressed', 'true'); }

  difficultySel.addEventListener('change', () => {
    save.difficulty = difficultySel.value;
    persistSave();
  });

  canvas.addEventListener('click', () => {
    Audio1.unlock();
    canvas.focus();
    if (state === STATE.START) beginPlaying();
  });

  // ---------------------------------------------------------------------
  // Update (fixed timestep physics, decoupled from monitor refresh rate)
  // ---------------------------------------------------------------------
  const STEP = 1 / 60;
  let accumulator = 0;
  let lastTime = null;

  function stepPhysics(dt) {
    const speed = 4;
    if (isLeft()) { player.vx = -speed; player.facing = -1; }
    else if (isRight()) { player.vx = speed; player.facing = 1; }
    else { player.vx = 0; }

    if (isJumpPressed() && player.onGround) {
      player.vy = -12;
      player.onGround = false;
      Audio1.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, 4, '#ffffff', { life: 0.25, speed: 1, upBias: 0.5, size: 2 });
    }

    player.vy += diff.gravity;
    if (player.vy > 18) player.vy = 18;

    // --- resolve X axis ---
    player.x += player.vx;
    player.x = Math.max(0, Math.min(level.width - player.w, player.x));
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
      }
    }

    // --- resolve Y axis ---
    player.onGround = false;
    player.y += player.vy;
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          if (Math.random() < 0.15) spawnParticles(player.x + player.w / 2, player.y + player.h, 2, '#c8c8c8', { life: 0.2, speed: 0.5, size: 2 });
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    if (player.invuln > 0) player.invuln--;
    if (player.star > 0) player.star--;

    if (player.y > CANVAS_H + 150) {
      loseLife();
      return;
    }

    // animation timer
    if (player.vx !== 0 && player.onGround) {
      player.animTimer += dt;
      if (player.animTimer > 0.1) { player.animTimer = 0; player.animFrame = (player.animFrame + 1) % 2; }
    } else {
      player.animFrame = 0;
    }

    // coins
    for (const coin of level.coins) {
      if (!coin.collected && rectsOverlap(player, coin)) {
        coin.collected = true;
        coinCount++;
        score += 50;
        Audio1.coin();
        spawnParticles(coin.x + coin.w / 2, coin.y + coin.h / 2, 8, '#ffd700', { life: 0.35, speed: 2 });
      }
    }

    // powerups
    for (const pu of level.powerups) {
      if (!pu.collected && rectsOverlap(player, pu)) {
        pu.collected = true;
        score += 150;
        Audio1.powerup();
        spawnParticles(pu.x + pu.w / 2, pu.y + pu.h / 2, 14, pu.kind === 'star' ? '#ffea00' : '#00c8ff', { life: 0.5, speed: 3 });
        if (pu.kind === 'shield') { player.shielded = true; announce('Shield acquired! Absorbs the next hit.'); }
        else if (pu.kind === 'star') { player.star = 60 * 8; announce('Star power! Temporary invincibility.'); }
      }
    }

    // hazards (spikes) - always damaging, not stompable
    for (const hz of level.hazards) {
      if (rectsOverlap(player, hz)) {
        if (player.star > 0) continue;
        if (player.shielded) { player.shielded = false; player.invuln = 60; addShake(4); continue; }
        loseLife();
        return;
      }
    }

    // enemies
    for (const en of level.enemies) {
      if (!en.alive) continue;
      const baseSpeed = (en.type === 'bat' ? 1.8 : 1.5) * diff.enemySpeedMul;
      en.x += en.dir * baseSpeed;
      if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;
      if (en.type === 'bat') {
        en.phase += dt * 3;
        en.y = en.baseY + Math.sin(en.phase) * 30;
      }

      if (rectsOverlap(player, en)) {
        const playerBottom = player.y + player.h;
        const stomped = en.type !== 'bat_shield' && player.vy > 0 && (playerBottom - en.y) < 18;
        if (player.star > 0) {
          en.alive = false;
          score += 100;
          Audio1.stomp();
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 10, '#ffea00', { life: 0.4, speed: 2 });
        } else if (stomped) {
          en.alive = false;
          player.vy = -8;
          score += 100;
          Audio1.stomp();
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 10, '#8b4513', { life: 0.4, speed: 2 });
        } else if (player.shielded) {
          player.shielded = false;
          player.invuln = 60;
          addShake(4);
        } else {
          loseLife();
          return;
        }
      }
    }

    // flag
    if (rectsOverlap(player, level.flag)) {
      score += 500;
      if (levelIndex < LEVELS.length - 1) {
        state = STATE.LEVEL_COMPLETE;
        Audio1.levelComplete();
        announce('Level ' + (levelIndex + 1) + ' complete! Score: ' + score + '. Press Enter for the next level.');
      } else {
        state = STATE.COMPLETE;
        Audio1.stopMusic();
        Audio1.win();
        if (score > save.bestScore) { save.bestScore = score; persistSave(); bestEl.textContent = save.bestScore; }
        announce('You beat all levels! Final score: ' + score + '. Press R to play again.');
      }
    }

    camX = Math.max(0, Math.min(level.width - CANVAS_W, player.x - CANVAS_W / 2));

    scoreEl.textContent = score;
    coinsEl.textContent = coinCount;
    livesEl.textContent = lives;
  }

  function update(dt) {
    updateParticles(dt);
    if (shake > 0) shake *= 0.85;
    if (shake < 0.1) shake = 0;

    if (state === STATE.START) {
      return;
    }
    if (state === STATE.PAUSED) {
      return;
    }
    if (state === STATE.LEVEL_COMPLETE) {
      if (keys['Enter'] || keys['Space'] || touchState.jump) {
        loadLevel(levelIndex + 1);
        state = STATE.PLAYING;
      }
      return;
    }
    if (state === STATE.GAMEOVER || state === STATE.COMPLETE) {
      if (keys['KeyR']) startNewGame();
      return;
    }
    stepPhysics(dt);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function drawBackground() {
    ctx.fillStyle = level.theme;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 400 - camX * 0.3) % (CANVAS_W + 200)) - 100;
      drawCloud(cx, 60 + (i % 3) * 30);
    }
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 10, 22, 0, Math.PI * 2);
    ctx.arc(x + 40, y, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return; // blink while invulnerable
    const bob = player.onGround && player.vx !== 0 ? (player.animFrame === 1 ? 2 : 0) : 0;
    const px = player.x, py = player.y + bob;

    if (player.star > 0) {
      const hue = (Math.floor(Date.now() / 60) % 6) * 60;
      ctx.fillStyle = `hsl(${hue},90%,60%)`;
    } else {
      ctx.fillStyle = '#e60000';
    }
    ctx.fillRect(px, py, player.w, player.h * 0.5);
    ctx.fillStyle = player.star > 0 ? '#fff' : '#0000cd';
    ctx.fillRect(px, py + player.h * 0.5, player.w, player.h * 0.5 - (player.onGround ? bob : 0));

    // face
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(player.facing > 0 ? px + player.w - 10 : px, py + 4, 10, 10);

    // simple leg animation while running
    ctx.fillStyle = '#222';
    if (!player.onGround) {
      ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
      ctx.fillRect(px + player.w - 10, py + player.h - 10, 8, 10);
    } else if (player.vx !== 0) {
      if (player.animFrame === 0) {
        ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
        ctx.fillRect(px + player.w - 10, py + player.h - 8, 8, 8);
      } else {
        ctx.fillRect(px + 2, py + player.h - 8, 8, 8);
        ctx.fillRect(px + player.w - 10, py + player.h - 6, 8, 6);
      }
    } else {
      ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
      ctx.fillRect(px + player.w - 10, py + player.h - 6, 8, 6);
    }

    if (player.shielded) {
      ctx.strokeStyle = '#00c8ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, player.w * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  function drawEnemy(en) {
    if (en.type === 'bat') {
      ctx.fillStyle = '#4a2e83';
      ctx.beginPath();
      ctx.ellipse(en.x + en.w / 2, en.y + en.h / 2, en.w / 2, en.h / 2.6, 0, 0, Math.PI * 2);
      ctx.fill();
      const wingFlap = Math.sin(en.phase * 3) * 8;
      ctx.fillStyle = '#2c1a52';
      ctx.beginPath();
      ctx.moveTo(en.x, en.y + en.h / 2);
      ctx.lineTo(en.x - 10, en.y + en.h / 2 - wingFlap);
      ctx.lineTo(en.x, en.y + en.h / 2 + 6);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(en.x + en.w, en.y + en.h / 2);
      ctx.lineTo(en.x + en.w + 10, en.y + en.h / 2 - wingFlap);
      ctx.lineTo(en.x + en.w, en.y + en.h / 2 + 6);
      ctx.fill();
      ctx.fillStyle = '#ff4040';
      ctx.fillRect(en.x + 6, en.y + 8, 4, 4);
      ctx.fillRect(en.x + en.w - 10, en.y + 8, 4, 4);
    } else {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(en.x, en.y, en.w, en.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(en.x + 4, en.y + 6, 6, 6);
      ctx.fillRect(en.x + en.w - 10, en.y + 6, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(en.x + 6, en.y + 8, 2, 2);
      ctx.fillRect(en.x + en.w - 8, en.y + 8, 2, 2);
      ctx.fillStyle = '#5a2e0c';
      ctx.fillRect(en.x, en.y + en.h - 6, en.w, 6);
    }
  }

  function drawHazard(hz) {
    ctx.fillStyle = '#888';
    const spikes = Math.floor(hz.w / 10);
    for (let i = 0; i < spikes; i++) {
      ctx.beginPath();
      ctx.moveTo(hz.x + i * 10, hz.y + hz.h);
      ctx.lineTo(hz.x + i * 10 + 5, hz.y);
      ctx.lineTo(hz.x + i * 10 + 10, hz.y + hz.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPowerup(pu) {
    ctx.save();
    ctx.translate(pu.x + pu.w / 2, pu.y + pu.h / 2);
    if (pu.kind === 'star') {
      ctx.fillStyle = '#ffea00';
      ctx.strokeStyle = '#b8860b';
      const spikes = 5, outerR = pu.w / 2, innerR = outerR / 2.4;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (Math.PI / spikes) * i - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = '#00c8ff';
      ctx.beginPath();
      ctx.arc(0, 0, pu.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#005f7a';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', 0, 1);
    }
    ctx.restore();
  }

  function drawWorld() {
    ctx.fillStyle = '#8b4513';
    for (const p of level.platforms) {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#3a9d23';
      ctx.fillRect(p.x, p.y, p.w, 8);
    }

    for (const hz of level.hazards) drawHazard(hz);

    ctx.fillStyle = '#ffd700';
    for (const coin of level.coins) {
      if (coin.collected) continue;
      ctx.beginPath();
      ctx.arc(coin.x + coin.w / 2, coin.y + coin.h / 2, coin.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();
    }

    for (const pu of level.powerups) {
      if (!pu.collected) drawPowerup(pu);
    }

    for (const en of level.enemies) {
      if (en.alive) drawEnemy(en);
    }

    ctx.fillStyle = '#555';
    ctx.fillRect(level.flag.x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#e60000';
    ctx.beginPath();
    ctx.moveTo(level.flag.x + 6, level.flag.y);
    ctx.lineTo(level.flag.x + 40, level.flag.y + 15);
    ctx.lineTo(level.flag.x + 6, level.flag.y + 30);
    ctx.closePath();
    ctx.fill();

    drawPlayer();
    drawParticles();
  }

  function drawOverlayBox(lines) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    let y = CANVAS_H / 2 - (lines.length - 1) * 18;
    lines.forEach((line, i) => {
      ctx.font = i === 0 ? '30px monospace' : '16px monospace';
      ctx.fillText(line, CANVAS_W / 2, y + i * 36);
    });
  }

  function draw() {
    ctx.save();
    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(sx, sy);

    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);
    drawWorld();
    ctx.restore();

    if (state === STATE.START) {
      drawOverlayBox(['SUPER MAHSA BROS', 'Arrow keys / A-D to move, Space to jump', 'Stomp goombas, dodge spikes, grab coins', 'Press Enter/Space or click to start']);
    } else if (state === STATE.PAUSED) {
      drawOverlayBox(['PAUSED', 'Press P to resume']);
    } else if (state === STATE.LEVEL_COMPLETE) {
      drawOverlayBox(['LEVEL ' + (levelIndex + 1) + ' COMPLETE!', 'Score: ' + score, 'Press Enter for next level']);
    } else if (state === STATE.GAMEOVER) {
      drawOverlayBox(['GAME OVER', 'Score: ' + score, 'Press R to restart']);
    } else if (state === STATE.COMPLETE) {
      drawOverlayBox(['YOU WIN!', 'Final score: ' + score, 'Press R to play again']);
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Main loop - fixed timestep for frame-rate independent physics
  // ---------------------------------------------------------------------
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    let frameTime = (ts - lastTime) / 1000;
    lastTime = ts;
    if (frameTime > 0.25) frameTime = 0.25; // avoid spiral of death on tab-back
    accumulator += frameTime;

    while (accumulator >= STEP) {
      update(STEP);
      accumulator -= STEP;
    }
    draw();
    requestAnimationFrame(loop);
  }

  announce('Press Enter/Space or click the game to start. Use the difficulty selector to choose a challenge level.');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
