<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Mahsa Bros</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0f2a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    font-family: 'Baloo 2', 'Courier New', monospace;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    background: #0a0f2a;
    border: 4px solid #222;
  }
  #hud {
    color: #ffcf3d;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255, 207, 61, 0.6), 2px 2px 0 rgba(20, 10, 40, 0.8);
  }
  #msg {
    color: #cfe0ff;
    font-size: 16px;
    font-weight: 700;
    margin-top: 8px;
    text-shadow: 1px 1px 0 rgba(20, 10, 40, 0.8);
    min-height: 20px;
  }
  #titleScreen {
    position: relative;
    width: 640px;
    height: 640px;
    background: url('assets/title-night-alpaca.png') center / cover no-repeat;
    border: 4px solid #222;
    cursor: pointer;
  }
  #startBtn {
    position: absolute;
    left: 37%;
    top: 86%;
    width: 26%;
    height: 8%;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  #gameArea {
    display: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="titleScreen">
    <button id="startBtn" aria-label="Start Game"></button>
  </div>
  <div id="gameArea">
    <div id="hud">Score: <span id="score">0</span> &nbsp; Coins: <span id="coins">0</span> &nbsp; Lives: <span id="lives">3</span></div>
    <canvas id="game" width="800" height="400"></canvas>
    <div id="msg">Arrow keys / A-D to move, Space or Up to jump. Stomp goombas, grab coins, reach the flag!</div>
  </div>
</div>
<script>
(function() {
  const titleScreen = document.getElementById('titleScreen');
  const gameArea = document.getElementById('gameArea');
  const startBtn = document.getElementById('startBtn');
  function startGame() {
    titleScreen.style.display = 'none';
    gameArea.style.display = 'block';
    playSound('start');
  }
  startBtn.addEventListener('click', startGame);
  titleScreen.addEventListener('click', startGame);

  const soundFiles = {
    start: 'assets/sounds/start.mp3',
    jump: 'assets/sounds/jump.mp3',
    coin: 'assets/sounds/coin.mp3',
    stomp: 'assets/sounds/stomp.mp3',
    hurt: 'assets/sounds/hurt.mp3',
    gameover: 'assets/sounds/gameover.mp3',
    win: 'assets/sounds/win.mp3',
  };
  const sounds = {};
  for (const name in soundFiles) {
    const a = new Audio(soundFiles[name]);
    a.volume = 0.6;
    sounds[name] = a;
  }
  function playSound(name) {
    const base = sounds[name];
    if (!base) return;
    const a = base.cloneNode();
    a.volume = base.volume;
    a.play().catch(() => {});
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const livesEl = document.getElementById('lives');
  const msgEl = document.getElementById('msg');

  const GRAVITY = 0.6;
  const GROUND_Y = 360;
  const WORLD_WIDTH = 3200;

  const stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * (WORLD_WIDTH + 400),
    y: Math.random() * 220,
    r: Math.random() * 1.4 + 0.6,
    a: Math.random() * 0.5 + 0.4,
  }));

  const keys = {};
  window.addEventListener('keydown', e => {
    if (titleScreen.style.display !== 'none' && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
    }
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function buildLevel() {
    const platforms = [
      { x: 0, y: GROUND_Y, w: 900, h: 40 },
      { x: 980, y: GROUND_Y, w: 500, h: 40 },
      { x: 1560, y: GROUND_Y, w: 700, h: 40 },
      { x: 2340, y: GROUND_Y, w: 860, h: 40 },
      { x: 300, y: 280, w: 100, h: 20 },
      { x: 500, y: 220, w: 100, h: 20 },
      { x: 1100, y: 260, w: 120, h: 20 },
      { x: 1700, y: 260, w: 120, h: 20 },
      { x: 1900, y: 200, w: 120, h: 20 },
      { x: 2500, y: 260, w: 140, h: 20 },
    ];
    const coins = [
      {x: 340, y: 240}, {x: 540, y: 180}, {x: 1140, y: 220},
      {x: 1740, y: 220}, {x: 1940, y: 160}, {x: 2540, y: 220},
      {x: 700, y: 320}, {x: 1400, y: 320}, {x: 2100, y: 320},
    ].map(c => ({...c, w: 20, h: 20, collected: false}));
    const enemies = [
      { x: 500, y: GROUND_Y - 28, w: 28, h: 28, dir: -1, alive: true, minX: 400, maxX: 850 },
      { x: 1200, y: GROUND_Y - 28, w: 28, h: 28, dir: 1, alive: true, minX: 1050, maxX: 1450 },
      { x: 1900, y: GROUND_Y - 28, w: 28, h: 28, dir: -1, alive: true, minX: 1650, maxX: 2200 },
      { x: 2600, y: GROUND_Y - 28, w: 28, h: 28, dir: 1, alive: true, minX: 2400, maxX: 3100 },
    ];
    const flag = { x: WORLD_WIDTH - 100, y: GROUND_Y - 200, w: 20, h: 200 };
    return { platforms, coins, enemies, flag };
  }

  let level = buildLevel();

  const player = {
    x: 50, y: GROUND_Y - 40, w: 28, h: 40,
    vx: 0, vy: 0, onGround: false, facing: 1,
    dead: false,
  };

  let score = 0;
  let coinCount = 0;
  let lives = 3;
  let camX = 0;
  let won = false;
  let gameOver = false;

  function resetPlayer() {
    player.x = 50; player.y = GROUND_Y - 40;
    player.vx = 0; player.vy = 0; player.dead = false;
    camX = 0;
  }

  function resetGame() {
    level = buildLevel();
    score = 0; coinCount = 0; lives = 3;
    won = false; gameOver = false;
    resetPlayer();
    msgEl.textContent = 'Arrow keys / A-D to move, Space or Up to jump. Stomp goombas, grab coins, reach the flag!';
  }

  function loseLife() {
    lives--;
    if (lives <= 0) {
      gameOver = true;
      playSound('gameover');
      msgEl.textContent = 'Game Over! Press R to restart.';
    } else {
      playSound('hurt');
      resetPlayer();
    }
  }

  function update() {
    if (gameOver || won) {
      if (keys['KeyR']) resetGame();
      return;
    }

    const speed = 4;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -speed; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = speed; player.facing = 1; }
    else { player.vx = 0; }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
      player.vy = -12;
      player.onGround = false;
      playSound('jump');
    }

    player.vy += GRAVITY;
    if (player.vy > 18) player.vy = 18;

    player.x += player.vx;
    player.x = Math.max(0, Math.min(WORLD_WIDTH - player.w, player.x));
    player.onGround = false;

    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        const prevBottom = player.y + player.h - player.vy;
        if (prevBottom <= p.y && player.vy >= 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }

    player.y += player.vy;
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    if (player.y > canvas.height + 100) {
      loseLife();
      return;
    }

    for (const coin of level.coins) {
      if (!coin.collected && rectsOverlap(player, coin)) {
        coin.collected = true;
        coinCount++;
        score += 50;
        playSound('coin');
      }
    }

    for (const en of level.enemies) {
      if (!en.alive) continue;
      en.x += en.dir * 1.5;
      if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;

      if (rectsOverlap(player, en)) {
        const playerBottom = player.y + player.h;
        const stomped = player.vy > 0 && (playerBottom - en.y) < 18;
        if (stomped) {
          en.alive = false;
          player.vy = -8;
          score += 100;
          playSound('stomp');
        } else {
          loseLife();
          return;
        }
      }
    }

    if (rectsOverlap(player, level.flag)) {
      won = true;
      score += 500;
      playSound('win');
      msgEl.textContent = 'You reached the flag! Score: ' + score + '. Press R to play again.';
    }

    camX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, player.x - canvas.width / 2));

    scoreEl.textContent = score;
    coinsEl.textContent = coinCount;
    livesEl.textContent = lives;
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, '#060a2a');
    sky.addColorStop(0.55, '#151c4a');
    sky.addColorStop(1, '#2c3570');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // stars (subtle parallax)
    for (const s of stars) {
      const sx = s.x - camX * 0.15;
      if (sx < -10 || sx > canvas.width + 10) continue;
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.beginPath();
      ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // moon with soft glow, gently parallaxed
    const moonX = canvas.width - 100 - camX * 0.1;
    const moonY = 70;
    const glow = ctx.createRadialGradient(moonX, moonY, 4, moonX, moonY, 46);
    glow.addColorStop(0, 'rgba(255,250,220,0.55)');
    glow.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fdf6d8';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 22, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 6; i++) {
      const cx = ((i * 400 - camX * 0.3) % (canvas.width + 200)) - 100;
      drawCloud(cx, 60 + (i % 3) * 30);
    }
  }

  function drawCloud(x, y) {
    const puff = (px, py, r) => {
      const g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(1, 'rgba(200,210,240,0.55)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    };
    puff(x, y, 18);
    puff(x + 20, y - 10, 24);
    puff(x + 42, y, 18);
  }

  function drawGoomba(en) {
    const { x, y, w, h } = en;
    const cx = x + w / 2;
    ctx.save();
    // cap (mushroom body)
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.06, y + h);
    ctx.quadraticCurveTo(x, y + h * 0.2, cx, y + h * 0.15);
    ctx.quadraticCurveTo(x + w, y + h * 0.2, x + w * 0.94, y + h);
    ctx.quadraticCurveTo(x + w * 0.85, y + h * 0.78, x + w * 0.62, y + h * 0.78);
    ctx.lineTo(x + w * 0.38, y + h * 0.78);
    ctx.quadraticCurveTo(x + w * 0.15, y + h * 0.78, x + w * 0.06, y + h);
    ctx.closePath();
    ctx.fill();
    // feet
    ctx.fillStyle = '#5a2e0c';
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.98, w * 0.46, h * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.32, y + h * 0.42, w * 0.16, h * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.68, y + h * 0.42, w * 0.16, h * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(x + w * 0.34, y + h * 0.46, w * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.7, y + h * 0.46, w * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAlpaca() {
    const { x, y, w, h, facing } = player;
    const cx = x + w / 2;

    ctx.save();

    // legs
    ctx.fillStyle = '#6dbf85';
    ctx.fillRect(x + w * 0.14, y + h * 0.82, w * 0.2, h * 0.2);
    ctx.fillRect(x + w * 0.66, y + h * 0.82, w * 0.2, h * 0.2);

    // fluffy body
    ctx.fillStyle = '#8fd9a0';
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.62, w * 0.58, h * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a8e6b0';
    const tufts = [[-0.42, -0.08], [0.42, -0.08], [0, -0.3], [-0.5, 0.22], [0.5, 0.22]];
    for (const [dx, dy] of tufts) {
      ctx.beginPath();
      ctx.arc(cx + dx * w, y + h * 0.62 + dy * h, w * 0.24, 0, Math.PI * 2);
      ctx.fill();
    }

    // tail
    ctx.fillStyle = '#a8e6b0';
    ctx.beginPath();
    ctx.arc(x - facing * w * 0.05 + (facing > 0 ? 0 : w), y + h * 0.55, w * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // neck
    ctx.fillStyle = '#8fd9a0';
    ctx.beginPath();
    ctx.ellipse(cx + facing * w * 0.05, y + h * 0.18, w * 0.24, h * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // head
    const headCx = cx + facing * w * 0.14;
    const headCy = y - h * 0.02;
    ctx.beginPath();
    ctx.arc(headCx, headCy, w * 0.44, 0, Math.PI * 2);
    ctx.fill();

    // ears
    ctx.fillStyle = '#6dbf85';
    ctx.beginPath();
    ctx.ellipse(headCx - w * 0.3, headCy - h * 0.3, w * 0.13, h * 0.2, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headCx + w * 0.3, headCy - h * 0.3, w * 0.13, h * 0.2, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8f9e8';
    ctx.beginPath();
    ctx.ellipse(headCx - w * 0.3, headCy - h * 0.3, w * 0.06, h * 0.1, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headCx + w * 0.3, headCy - h * 0.3, w * 0.06, h * 0.1, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // muzzle
    ctx.fillStyle = '#fbeedd';
    ctx.beginPath();
    ctx.ellipse(headCx + facing * w * 0.18, headCy + h * 0.08, w * 0.26, h * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,150,180,0.55)';
    ctx.beginPath();
    ctx.arc(headCx - facing * w * 0.18, headCy + h * 0.1, w * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(headCx + facing * w * 0.02, headCy - h * 0.06, w * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(headCx + facing * w * 0.32, headCy - h * 0.04, w * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(headCx + facing * w * 0.02 - facing * 1, headCy - h * 0.09, w * 0.035, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(headCx + facing * w * 0.32 - facing * 1, headCy - h * 0.07, w * 0.03, 0, Math.PI * 2);
    ctx.fill();

    // nose
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(headCx + facing * w * 0.4, headCy + h * 0.08, w * 0.055, h * 0.04, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);

    for (const p of level.platforms) {
      ctx.fillStyle = '#2e2140';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#2f6b46';
      ctx.fillRect(p.x, p.y, p.w, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(p.x, p.y + 8, p.w, 2);
    }

    for (const coin of level.coins) {
      if (coin.collected) continue;
      const ccx = coin.x + coin.w / 2;
      const ccy = coin.y + coin.h / 2;
      const glow = ctx.createRadialGradient(ccx, ccy, 2, ccx, ccy, coin.w);
      glow.addColorStop(0, 'rgba(255,224,130,0.55)');
      glow.addColorStop(1, 'rgba(255,224,130,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(ccx, ccy, coin.w, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(ccx, ccy, coin.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();
    }

    for (const en of level.enemies) {
      if (!en.alive) continue;
      drawGoomba(en);
    }

    ctx.fillStyle = '#c7d0e6';
    ctx.fillRect(level.flag.x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#ffcf3d';
    ctx.beginPath();
    ctx.moveTo(level.flag.x + 6, level.flag.y);
    ctx.lineTo(level.flag.x + 40, level.flag.y + 15);
    ctx.lineTo(level.flag.x + 6, level.flag.y + 30);
    ctx.closePath();
    ctx.fill();

    if (!player.dead) drawAlpaca();

    ctx.restore();

    if (gameOver) {
      ctx.fillStyle = 'rgba(6,10,42,0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '800 34px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,207,61,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    } else if (won) {
      ctx.fillStyle = 'rgba(6,10,42,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '800 34px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,207,61,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
