<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mahsa Bros</title>
<style>
  :root {
    --sky: #5c94fc;
    --ground: #8b4513;
    --grass: #3a9d23;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100%;
    font-family: 'Courier New', monospace;
    color: #fff;
    touch-action: manipulation;
  }
  #wrap {
    text-align: center;
    max-width: 900px;
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    margin-bottom: 6px;
    text-shadow: 2px 2px #000;
    flex-wrap: wrap;
    gap: 4px;
  }
  #hud .stat { margin: 0 6px; white-space: nowrap; }
  #canvasWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }
  canvas {
    background: var(--sky);
    border: 4px solid #222;
    image-rendering: pixelated;
    width: 100%;
    height: auto;
    display: block;
    outline: none;
  }
  canvas:focus-visible {
    outline: 3px solid #ffd700;
  }
  #msg {
    font-size: 15px;
    margin-top: 8px;
    text-shadow: 1px 1px #000;
    min-height: 20px;
  }
  .btnRow {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    background: #222;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: #444; outline: 2px solid #ffd700; }
  button[aria-pressed="true"] { background: #3a9d23; border-color: #3a9d23; }
  /* touch controls */
  #touchControls {
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 10px;
    user-select: none;
  }
  #touchControls.active { display: flex; }
  .padBtn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid #fff;
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .padGroup { display: flex; gap: 10px; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
  /* High Contrast mode swaps the actual draw palette (see PALETTE.access in
     the script) rather than relying on a CSS filter, which crushed dark
     tones and didn't reliably help colorblind players distinguish objects. */
</style>
</head>
<body>
<div id="wrap">
  <h1 class="sr-only">Super Mahsa Bros - a platformer game</h1>
  <div id="hud">
    <span class="stat">Score: <span id="score">0</span></span>
    <span class="stat">Coins: <span id="coins">0</span></span>
    <span class="stat">Lives: <span id="lives">3</span></span>
    <span class="stat">Level: <span id="levelNum">1</span>/<span id="levelTotal">3</span></span>
    <span class="stat">Best (<span id="bestDiff">Normal</span>): <span id="best">0</span></span>
    <span class="stat" id="statusEffects" aria-live="polite"></span>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="800" height="400" tabindex="0" role="img" aria-label="Game viewport. Use arrow keys or A/D to move, Space to jump, P to pause."></canvas>
  </div>
  <div id="msg" aria-live="polite">Loading...</div>
  <div class="btnRow">
    <button id="btnPause" aria-pressed="false">Pause (P)</button>
    <button id="btnMute" aria-pressed="false">Mute (M)</button>
    <button id="btnContrast" aria-pressed="false">High Contrast (C)</button>
    <button id="btnMotion" aria-pressed="false">Reduce Motion (V)</button>
    <button id="btnTouch" aria-pressed="false">Show Touch Controls</button>
    <label for="difficulty" class="sr-only">Difficulty</label>
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div class="btnRow">
    <label for="remapLeft">Extra left key:</label>
    <select id="remapLeft" aria-label="Extra left key"></select>
    <label for="remapRight">Extra right key:</label>
    <select id="remapRight" aria-label="Extra right key"></select>
    <label for="remapJump">Extra jump key:</label>
    <select id="remapJump" aria-label="Extra jump key"></select>
  </div>
  <div id="touchControls">
    <div class="padGroup">
      <button class="padBtn" id="padLeft" aria-label="Move left">&#8592;</button>
      <button class="padBtn" id="padRight" aria-label="Move right">&#8594;</button>
    </div>
    <button class="padBtn" id="padJump" aria-label="Jump">&#8593;</button>
  </div>
  <div id="liveAnnouncer" class="sr-only" aria-live="assertive"></div>
</div>
<script>
(function() {
  'use strict';

  // ---------------------------------------------------------------------
  // Canvas / DOM setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const livesEl = document.getElementById('lives');
  const levelNumEl = document.getElementById('levelNum');
  const levelTotalEl = document.getElementById('levelTotal');
  const bestEl = document.getElementById('best');
  const bestDiffEl = document.getElementById('bestDiff');
  const statusEl = document.getElementById('statusEffects');
  const msgEl = document.getElementById('msg');
  const announcer = document.getElementById('liveAnnouncer');
  const btnPause = document.getElementById('btnPause');
  const btnMute = document.getElementById('btnMute');
  const btnContrast = document.getElementById('btnContrast');
  const btnMotion = document.getElementById('btnMotion');
  const btnTouch = document.getElementById('btnTouch');
  const touchControls = document.getElementById('touchControls');
  const difficultySel = document.getElementById('difficulty');

  function announce(text) {
    msgEl.textContent = text;
    announcer.textContent = text;
  }

  // ---------------------------------------------------------------------
  // Config / constants
  // ---------------------------------------------------------------------
  const GROUND_Y = 360;
  const CANVAS_W = 800;
  const CANVAS_H = 400;

  const DIFFICULTY = {
    easy:   { lives: 5, enemySpeedMul: 0.75, gravity: 0.55 },
    normal: { lives: 3, enemySpeedMul: 1,    gravity: 0.6 },
    hard:   { lives: 2, enemySpeedMul: 1.35, gravity: 0.68 },
  };

  const STORAGE_KEY = 'superMahsaBros.save.v1';

  function loadSave() {
    const bareDefaults = () => ({ bestScores: { easy: 0, normal: 0, hard: 0 }, difficulty: 'normal', muted: false, highContrast: false, reduceMotion: false, playerName: '', bindings: { left: '', right: '', jump: '' }, stars: {} });
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const defaults = bareDefaults();
      if (!raw) return defaults;
      const parsed = JSON.parse(raw);
      const merged = Object.assign(defaults, parsed);
      merged.bindings = Object.assign({ left: '', right: '', jump: '' }, parsed.bindings);
      merged.stars = parsed.stars || {};
      // best score used to be a single global number (pre-per-difficulty
      // tracking) - migrate it into the "normal" slot instead of losing it
      merged.bestScores = Object.assign({ easy: 0, normal: 0, hard: 0 }, parsed.bestScores);
      if (parsed.bestScore && !parsed.bestScores) merged.bestScores.normal = parsed.bestScore;
      delete merged.bestScore;
      return merged;
    } catch (e) {
      return bareDefaults();
    }
  }

  function persistSave() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    } catch (e) { /* storage unavailable (private mode / quota) - fail silently, non-critical */ }
  }

  const save = loadSave();
  difficultySel.value = save.difficulty;

  // ---------------------------------------------------------------------
  // Audio (synthesized with Web Audio API - no external assets needed)
  // ---------------------------------------------------------------------
  const Audio1 = (function() {
    let actx = null;
    let muted = save.muted;
    let musicTimer = null;
    let musicStep = 0;

    function ctxReady() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function tone(freq, start, dur, type, gainPeak, opts) {
      const ac = ctxReady();
      if (!ac || muted) return;
      opts = opts || {};
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, ac.currentTime + start);
      if (opts.slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.slideTo), ac.currentTime + start + dur);
      }
      gain.gain.setValueAtTime(0.0001, ac.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(gainPeak, ac.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(ac.currentTime + start);
      osc.stop(ac.currentTime + start + dur + 0.02);
    }

    function jump() { tone(440, 0, 0.18, 'square', 0.18, { slideTo: 880 }); }
    function coin() {
      tone(988, 0, 0.09, 'square', 0.15);
      tone(1319, 0.07, 0.14, 'square', 0.15);
    }
    function stomp() { tone(180, 0, 0.12, 'square', 0.2, { slideTo: 60 }); }
    function hurt() { tone(220, 0, 0.25, 'sawtooth', 0.18, { slideTo: 80 }); }
    function powerup() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.1, 'square', 0.16));
    }
    function gameover() {
      [392, 349, 330, 262].forEach((f, i) => tone(f, i * 0.18, 0.22, 'triangle', 0.2));
    }
    function win() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.12, 0.18, 'square', 0.2));
    }
    function levelComplete() {
      [659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.15, 'square', 0.18));
    }

    const MELODIES = [
      [262, 294, 330, 294, 262, 0, 330, 349, 392, 349, 330, 294, 262, 0, 0, 0],
      [294, 330, 349, 392, 349, 330, 294, 0, 349, 392, 440, 392, 349, 330, 294, 0],
      [220, 262, 294, 330, 294, 262, 220, 0, 294, 330, 349, 392, 349, 330, 294, 0],
    ];
    const BASS_ROOTS = [131, 147, 110];

    function kick(t) {
      const ac = ctxReady();
      if (!ac || muted) return;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, ac.currentTime + t);
      osc.frequency.exponentialRampToValueAtTime(40, ac.currentTime + t + 0.1);
      gain.gain.setValueAtTime(0.22, ac.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.12);
      osc.connect(gain).connect(ac.destination);
      osc.start(ac.currentTime + t);
      osc.stop(ac.currentTime + t + 0.14);
    }

    let currentMelody = MELODIES[0];
    let currentBassRoot = BASS_ROOTS[0];
    function startMusic(levelIdx) {
      stopMusic();
      const idx = levelIdx || 0;
      currentMelody = MELODIES[idx % MELODIES.length];
      currentBassRoot = BASS_ROOTS[idx % BASS_ROOTS.length];
      musicStep = 0;
      const tempo = 220 - idx * 12; // slightly faster pace each level for rising tension
      musicTimer = setInterval(() => {
        const ac = ctxReady();
        if (!ac || muted) return;
        const step = musicStep % currentMelody.length;
        const note = currentMelody[step];
        if (note > 0) tone(note, 0, 0.18, 'triangle', 0.05);
        if (step % 4 === 0) tone(currentBassRoot, 0, 0.22, 'sawtooth', 0.06);
        if (step % 8 === 0) kick(0);
        musicStep++;
      }, tempo);
    }
    function stopMusic() {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    function setMuted(v) { muted = v; if (muted) stopMusic(); }
    function isMuted() { return muted; }
    function unlock() { ctxReady(); }

    return { jump, coin, stomp, hurt, powerup, gameover, win, levelComplete, startMusic, stopMusic, setMuted, isMuted, unlock };
  })();

  // ---------------------------------------------------------------------
  // Particles (visual feedback / "juice")
  // ---------------------------------------------------------------------
  let particles = [];
  function spawnParticles(x, y, count, color, opts) {
    opts = opts || {};
    if (save.reduceMotion) count = Math.max(1, Math.floor(count / 3));
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (opts.speed || 2) + Math.random() * (opts.speedVar || 2);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (opts.upBias || 0),
        life: opts.life || 0.5,
        maxLife: opts.life || 0.5,
        color,
        size: opts.size || 3,
      });
    }
  }
  function updateParticles(dt) {
    particles.forEach(p => {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 0.15 * dt * 60;
      p.life -= dt;
    });
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------
  // Screen shake
  // ---------------------------------------------------------------------
  let shake = 0;
  function addShake(amount) { if (save.reduceMotion) return; shake = Math.min(12, shake + amount); }

  // ---------------------------------------------------------------------
  // Input (keyboard + touch)
  // ---------------------------------------------------------------------
  const keys = {};
  const touchState = { left: false, right: false, jump: false };

  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    Audio1.unlock();
    if (keys[e.code]) return;
    keys[e.code] = true;
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') toggleMute();
    if (e.code === 'KeyC') toggleContrast();
    if (e.code === 'KeyV') toggleMotion();
    if (e.code === 'KeyR') { if (state === STATE.GAMEOVER || state === STATE.COMPLETE) startNewGame(); }
    if (e.code === 'Enter' || e.code === 'Space') handleConfirmAction();
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    // release-to-shorten-hop: cutting upward velocity on early release gives
    // variable jump height instead of every jump being the same fixed arc.
    // Only cut when no jump input remains held (keyboard has 3 aliases plus
    // touch), so releasing one of several simultaneously-held jump keys
    // doesn't truncate a jump the player is still holding another way.
    if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !isJumpPressed() && player.vy < -4) {
      player.vy *= 0.45;
    }
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchState.left = touchState.right = touchState.jump = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      for (const k in keys) keys[k] = false;
      touchState.left = touchState.right = touchState.jump = false;
      if (state === STATE.PLAYING) togglePause(true);
    }
  });

  function bindHold(el, onDown, onUp) {
    const down = ev => { ev.preventDefault(); Audio1.unlock(); onDown(); };
    const up = ev => { ev.preventDefault(); onUp(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  bindHold(document.getElementById('padLeft'), () => touchState.left = true, () => touchState.left = false);
  bindHold(document.getElementById('padRight'), () => touchState.right = true, () => touchState.right = false);
  bindHold(document.getElementById('padJump'), () => {
    touchState.jump = true;
    handleConfirmAction();
  }, () => {
    touchState.jump = false;
    if (!isJumpPressed() && player.vy < -4) player.vy *= 0.45;
  });

  function isLeft() { return keys['ArrowLeft'] || keys['KeyA'] || touchState.left || (save.bindings.left && keys[save.bindings.left]); }
  function isRight() { return keys['ArrowRight'] || keys['KeyD'] || touchState.right || (save.bindings.right && keys[save.bindings.right]); }
  function isJumpPressed() { return keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchState.jump || (save.bindings.jump && keys[save.bindings.jump]); }

  const REMAP_OPTIONS = {
    left: [['Default (Arrows / A)', ''], ['J', 'KeyJ'], ['Z', 'KeyZ'], [',', 'Comma']],
    right: [['Default (Arrows / D)', ''], ['L', 'KeyL'], ['X', 'KeyX'], ['.', 'Period']],
    jump: [['Default (Space / Up / W)', ''], ['K', 'KeyK'], [';', 'Semicolon'], ['/', 'Slash']],
  };
  function populateRemapSelect(elId, action) {
    const sel = document.getElementById(elId);
    REMAP_OPTIONS[action].forEach(([label, val]) => {
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = label;
      sel.appendChild(opt);
    });
    sel.value = save.bindings[action] || '';
    sel.addEventListener('change', () => {
      save.bindings[action] = sel.value;
      persistSave();
    });
  }
  populateRemapSelect('remapLeft', 'left');
  populateRemapSelect('remapRight', 'right');
  populateRemapSelect('remapJump', 'jump');

  // auto-show touch controls on coarse pointers (phones/tablets)
  let touchControlsVisible = false;
  function setTouchControls(v) {
    touchControlsVisible = v;
    touchControls.classList.toggle('active', v);
    btnTouch.setAttribute('aria-pressed', String(v));
  }
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) setTouchControls(true);
  btnTouch.addEventListener('click', () => setTouchControls(!touchControlsVisible));

  // ---------------------------------------------------------------------
  // Collision helpers
  // ---------------------------------------------------------------------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------------------------------------------------------------------
  // Level definitions (3 levels, increasing difficulty & verticality)
  // ---------------------------------------------------------------------
  const PALETTE = {
    normal: { ground: '#8b4513', grass: '#3a9d23', coin: '#ffd700', coinStroke: '#b8860b', goomba: '#8b4513', goombaBelly: '#5a2e0c', bat: '#4a2e83', batWing: '#2c1a52', batEye: '#ff4040', spike: '#888888', flagPole: '#555555', flagCloth: '#e60000', shield: '#00c8ff', star: '#ffea00', checkpointOff: '#888888', checkpointOn: '#3a9d23' },
    // Deliberately large hue/lightness jumps (not just a filter) so the two
    // palettes read as genuinely different, not a subtle tint - verified via
    // reviewer feedback that a near-identical "accessible" palette is useless.
    access: { ground: '#5c3a00', grass: '#39ff14', coin: '#fff200', coinStroke: '#000000', goomba: '#ff8c00', goombaBelly: '#803d00', bat: '#ff00ff', batWing: '#990099', batEye: '#00ffff', spike: '#ffffff', flagPole: '#ffffff', flagCloth: '#ff0000', shield: '#00ffff', star: '#fff200', checkpointOff: '#ffffff', checkpointOn: '#39ff14' },
  };
  function pal(name) { return (save.highContrast ? PALETTE.access : PALETTE.normal)[name]; }

  function levelDefs() {
    return [
      // Level 1: introductory, gentle
      {
        width: 3200,
        theme: '#5c94fc',
        platforms: [
          { x: 0, y: GROUND_Y, w: 900, h: 40 },
          { x: 980, y: GROUND_Y, w: 500, h: 40 },
          { x: 1560, y: GROUND_Y, w: 700, h: 40 },
          { x: 2340, y: GROUND_Y, w: 860, h: 40 },
          { x: 300, y: 280, w: 100, h: 20 },
          { x: 500, y: 220, w: 100, h: 20 },
          { x: 1100, y: 260, w: 120, h: 20 },
          { x: 1700, y: 260, w: 120, h: 20 },
          { x: 1900, y: 200, w: 120, h: 20 },
          { x: 2500, y: 260, w: 140, h: 20 },
          { x: 480, y: 130, w: 80, h: 20 }, // secret ledge - only reachable by jumping from the platform below
        ],
        coins: [
          {x: 340, y: 240}, {x: 540, y: 180}, {x: 1140, y: 220},
          {x: 1740, y: 220}, {x: 1940, y: 160}, {x: 2540, y: 220},
          {x: 700, y: 320}, {x: 1400, y: 320}, {x: 2100, y: 320},
          {x: 500, y: 90}, {x: 535, y: 90}, // secret bonus coins on the hidden ledge
        ],
        enemies: [
          { type: 'goomba', x: 500, y: GROUND_Y - 28, dir: -1, minX: 400, maxX: 850 },
          { type: 'goomba', x: 1200, y: GROUND_Y - 28, dir: 1, minX: 1050, maxX: 1450 },
          { type: 'goomba', x: 1900, y: GROUND_Y - 28, dir: -1, minX: 1650, maxX: 2200 },
          { type: 'goomba', x: 2600, y: GROUND_Y - 28, dir: 1, minX: 2400, maxX: 3100 },
        ],
        hazards: [],
        powerups: [ { x: 1150, y: 220, kind: 'shield' } ],
        flagX: 3100,
        spawnX: 50,
      },
      // Level 2: more verticality, a flyer, a spike hazard
      {
        width: 3600,
        theme: '#3a6bc9',
        platforms: [
          { x: 0, y: GROUND_Y, w: 500, h: 40 },
          { x: 620, y: GROUND_Y, w: 260, h: 40 },
          { x: 980, y: GROUND_Y, w: 240, h: 40 },
          { x: 1360, y: GROUND_Y, w: 500, h: 40 },
          { x: 2000, y: GROUND_Y, w: 300, h: 40 },
          { x: 2440, y: GROUND_Y, w: 260, h: 40 },
          { x: 2840, y: GROUND_Y, w: 760, h: 40 },
          { x: 200, y: 260, w: 90, h: 20 },
          { x: 700, y: 230, w: 90, h: 20 },
          { x: 900, y: 170, w: 90, h: 20 },
          { x: 1450, y: 250, w: 110, h: 20 },
          { x: 1650, y: 190, w: 110, h: 20 },
          { x: 2100, y: 240, w: 100, h: 20 },
          { x: 2500, y: 200, w: 100, h: 20 },
          { x: 3000, y: 260, w: 140, h: 20 },
          { x: 3250, y: 190, w: 100, h: 20 },
        ],
        coins: [
          {x: 230, y: 220}, {x: 730, y: 190}, {x: 930, y: 130}, {x: 1480, y: 210},
          {x: 1680, y: 150}, {x: 2130, y: 200}, {x: 2530, y: 160}, {x: 3030, y: 220},
          {x: 3280, y: 150}, {x: 560, y: 320},
        ],
        enemies: [
          { type: 'goomba', x: 680, y: GROUND_Y - 28, dir: 1, minX: 620, maxX: 860 },

  const ALL_LEVEL_DEFS = levelDefs();

  function instantiateLevel(idx) {
    const def = ALL_LEVEL_DEFS[idx];
    return {
      width: def.width,
      theme: def.theme,
      platforms: def.platforms.map(p => {
        const clone = {...p};
        if (p.mover) { clone.mover = {...p.mover, baseX: p.x, baseY: p.y}; clone.movePhase = 0; }
        return clone;
      }),
      coins: def.coins.map(c => ({...c, w: 20, h: 20, collected: false})),
      enemies: def.enemies.map(e => ({...e, w: e.w || 28, h: e.h || 28, alive: true, phase: Math.random() * Math.PI * 2})),
      hazards: def.hazards.map(h => ({...h})),
      powerups: def.powerups.map(p => ({...p, w: 24, h: 24, collected: false})),
      flag: { x: def.flagX, y: GROUND_Y - 200, w: 20, h: 200 },
      checkpoint: def.checkpointX != null ? { x: def.checkpointX, y: GROUND_Y - 90, w: 18, h: 90, reached: false } : null,
      spawnX: def.spawnX,
      currentSpawnX: def.spawnX,
      totalCoins: def.coins.length,
    };
  }

  const LEVELS = ALL_LEVEL_DEFS;
  levelTotalEl.textContent = LEVELS.length;

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  const STATE = { START: 'start', PLAYING: 'playing', PAUSED: 'paused', LEVEL_COMPLETE: 'levelcomplete', GAMEOVER: 'gameover', COMPLETE: 'complete' };
  let state = STATE.START;
  let diffKey = save.difficulty;
  let diff = DIFFICULTY[diffKey];

  let levelIndex = 0;
  let level = instantiateLevel(0);

  const player = {
    x: 50, y: GROUND_Y - 40, w: 28, h: 40,
    vx: 0, vy: 0, onGround: false, facing: 1,
    invuln: 0, shielded: false, star: 0,
    animTimer: 0, animFrame: 0,
    ridingPlatform: null,
  };
  let jumpHeldPrev = false;
  let coyoteFrames = 0;

  let score = 0;
  let coinCount = 0;
  let lives = diff.lives;
  let camX = 0;
  let levelStartCoinCount = 0;
  let levelHitTaken = false;

  function updateBestDisplay(forKey) {
    const key = forKey || difficultySel.value;
    bestEl.textContent = save.bestScores[key] || 0;
    bestDiffEl.textContent = key.charAt(0).toUpperCase() + key.slice(1);
  }
  updateBestDisplay();

  function resetPlayer() {
    player.x = level.currentSpawnX; player.y = GROUND_Y - 40;
    player.vx = 0; player.vy = 0; player.invuln = 60;
    jumpHeldPrev = false; coyoteFrames = 0; player.ridingPlatform = null;
    camX = 0;
  }

  function loadLevel(idx) {
    levelIndex = idx;
    level = instantiateLevel(idx);
    levelNumEl.textContent = idx + 1;
    levelStartCoinCount = coinCount;
    levelHitTaken = false;
    resetPlayer();
  }

  function startNewGame() {
    diffKey = difficultySel.value;
    diff = DIFFICULTY[diffKey];
    save.difficulty = diffKey;
    persistSave();
    score = 0; coinCount = 0; lives = diff.lives;
    player.shielded = false; player.star = 0;
    loadLevel(0);
    state = STATE.PLAYING;
    announce('Go! Arrow keys / A-D to move, Space to jump. Stomp goombas, dodge spikes, grab coins, reach the flag!');
    Audio1.startMusic(levelIndex);
  }

  function beginPlaying() {
    state = STATE.PLAYING;
    Audio1.startMusic(levelIndex);
    announce('Go! Arrow keys / A-D to move, Space to jump. Stomp goombas, dodge spikes, grab coins, reach the flag!');
  }

  function advanceLevel() {
    loadLevel(levelIndex + 1);
    state = STATE.PLAYING;
    Audio1.startMusic(levelIndex);
  }

  function loseLife() {
    if (player.invuln > 0) return;
    levelHitTaken = true;
    lives--;
    Audio1.hurt();
    addShake(8);
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 12, '#e60000', { life: 0.4, speed: 3 });
    livesEl.textContent = lives;
    if (lives <= 0) {
      state = STATE.GAMEOVER;
      Audio1.stopMusic();
      Audio1.gameover();
      announce('Game Over! Final score ' + score + '. Press R, Space, Enter, or click to restart.');
    } else {
      resetPlayer();
      announce('Ouch! Lives remaining: ' + lives);
    }
  }

  function togglePause(forceOn) {

      state = STATE.PAUSED;
      Audio1.stopMusic();
      btnPause.setAttribute('aria-pressed', 'true');
      announce('Paused. Press P to resume.');
    } else if (state === STATE.PAUSED && !forceOn) {
      state = STATE.PLAYING;
      Audio1.startMusic(levelIndex);
      btnPause.setAttribute('aria-pressed', 'false');
      announce('Resumed.');
    }
  }
  btnPause.addEventListener('click', () => togglePause());

  function toggleMute() {
    const m = !Audio1.isMuted();
    Audio1.setMuted(m);

    btnMute.setAttribute('aria-pressed', String(m));
    btnMute.textContent = m ? 'Unmute (M)' : 'Mute (M)';

  btnMute.addEventListener('click', toggleMute);
  if (save.muted) { Audio1.setMuted(true); btnMute.setAttribute('aria-pressed', 'true'); btnMute.textContent = 'Unmute (M)'; }

  function toggleContrast() {
    save.highContrast = !save.highContrast;

  btnContrast.addEventListener('click', toggleContrast);
  if (save.highContrast) btnContrast.setAttribute('aria-pressed', 'true');

  function toggleMotion() {
    const on = !save.reduceMotion;
    save.reduceMotion = on;
    persistSave();
    btnMotion.setAttribute('aria-pressed', String(on));
    if (on) shake = 0;
  }
  btnMotion.addEventListener('click', toggleMotion);
  if (save.reduceMotion) btnMotion.setAttribute('aria-pressed', 'true');

  function handleConfirmAction() {
    if (state === STATE.START) beginPlaying();
    else if (state === STATE.LEVEL_COMPLETE) advanceLevel();
    else if (state === STATE.GAMEOVER || state === STATE.COMPLETE) startNewGame();
  }

  difficultySel.title = 'Difficulty applies when starting a new game (disabled during play)';
  difficultySel.addEventListener('change', () => {
    save.difficulty = difficultySel.value;
    persistSave();
    updateBestDisplay();
  });

  canvas.addEventListener('click', () => {
    Audio1.unlock();
    canvas.focus();
    handleConfirmAction();
  });

  // ---------------------------------------------------------------------
  // Update (fixed timestep physics, decoupled from monitor refresh rate)
  // ---------------------------------------------------------------------
  const STEP = 1 / 60;
  let accumulator = 0;
  let lastTime = null;

  function stepPhysics(dt) {
    const maxSpeed = 4, accel = 0.7, friction = 0.6;
    if (isLeft()) { player.vx = Math.max(player.vx - accel, -maxSpeed); player.facing = -1; }
    else if (isRight()) { player.vx = Math.min(player.vx + accel, maxSpeed); player.facing = 1; }
    else if (player.vx > 0) { player.vx = Math.max(0, player.vx - friction); }
    else if (player.vx < 0) { player.vx = Math.min(0, player.vx + friction); }

    // edge-triggered jump (no auto-bunny-hop from holding the key) with a
    // short coyote window so leaving a ledge doesn't feel unforgivingly strict
    const jumpNow = isJumpPressed();
    if (jumpNow && !jumpHeldPrev && coyoteFrames > 0) {
      player.vy = -12;
      player.onGround = false;
      coyoteFrames = 0;
      Audio1.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, 4, '#ffffff', { life: 0.25, speed: 1, upBias: 0.5, size: 2 });
    }
    jumpHeldPrev = jumpNow;

    player.vy += diff.gravity;
    if (player.vy > 18) player.vy = 18;

    // captured before any movement this frame - used by the stomp-vs-side-hit
    // heuristic below so it's correct regardless of fall speed
    const preMoveY = player.y;

    // Moving platforms - update position before this frame's collision pass,
    // and carry the player along if they were standing on one last frame
    // (real velocity inheritance, not just overlap-resolution, so a
    // descending/sliding platform can't outrun the player riding it).
    for (const p of level.platforms) {
      if (!p.mover) continue;
      const prevMoverX = p.x, prevMoverY = p.y;
      p.movePhase += dt * p.mover.speed;
      if (p.mover.axis === 'x') p.x = p.mover.baseX + Math.sin(p.movePhase) * p.mover.range;
      else p.y = p.mover.baseY + Math.sin(p.movePhase) * p.mover.range;
      if (player.ridingPlatform === p) {
        player.x += p.x - prevMoverX;
        player.y += p.y - prevMoverY;
      }
    }

    // --- resolve Y axis first, then X (landing on top takes priority over a
    // same-frame horizontal collision at a platform's edge). An earlier
    // "wasVerticallyClear" guard here was found to be dead code - it always
    // evaluated true because it re-tested the same Y value rectsOverlap had
    // just used, so it never actually changed behavior. Resolving Y before X
    // fixes the corner case for real: after landing, the player's Y no
    // longer overlaps the platform enough to also trigger a sideways push. ---
    player.onGround = false;
    player.ridingPlatform = null;
    player.y += player.vy;
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.ridingPlatform = p;
          if (Math.random() < 0.15) spawnParticles(player.x + player.w / 2, player.y + player.h, 2, '#c8c8c8', { life: 0.2, speed: 0.5, size: 2 });
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }
    if (player.onGround) coyoteFrames = 6;
    else if (coyoteFrames > 0) coyoteFrames--;

    player.x += player.vx;
    player.x = Math.max(0, Math.min(level.width - player.w, player.x));
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vx > 0) { player.x = p.x - player.w; player.vx = 0; }
        else if (player.vx < 0) { player.x = p.x + p.w; player.vx = 0; }
      }
    }

    if (player.invuln > 0) player.invuln--;
    if (player.star > 0) player.star--;
    statusEl.textContent = (player.shielded ? ' Shield active.' : '') + (player.star > 0 ? ' Star power: ' + Math.ceil(player.star / 60) + 's' : '');

    if (player.y > CANVAS_H + 150) {
      loseLife();
      return;
    }

    // animation timer
    if (player.vx !== 0 && player.onGround) {
      player.animTimer += dt;
      if (player.animTimer > 0.1) { player.animTimer = 0; player.animFrame = (player.animFrame + 1) % 2; }
    } else {
      player.animFrame = 0;
    }

    // coins
    for (const coin of level.coins) {
      if (!coin.collected && rectsOverlap(player, coin)) {
        coin.collected = true;
        coinCount++;
        score += 50;
        Audio1.coin();
        spawnParticles(coin.x + coin.w / 2, coin.y + coin.h / 2, 8, pal('coin'), { life: 0.35, speed: 2 });
      }
    }

    // checkpoint
    if (level.checkpoint && !level.checkpoint.reached && rectsOverlap(player, level.checkpoint)) {
      level.checkpoint.reached = true;
      level.currentSpawnX = level.checkpoint.x;
      spawnParticles(level.checkpoint.x + level.checkpoint.w / 2, level.checkpoint.y + 20, 10, pal('checkpointOn'), { life: 0.4, speed: 2 });
      announce('Checkpoint reached!');
    }

    // powerups
    for (const pu of level.powerups) {
      if (!pu.collected && rectsOverlap(player, pu)) {
        pu.collected = true;
        score += 150;
        Audio1.powerup();
        spawnParticles(pu.x + pu.w / 2, pu.y + pu.h / 2, 14, pu.kind === 'star' ? '#ffea00' : '#00c8ff', { life: 0.5, speed: 3 });
        if (pu.kind === 'shield') { player.shielded = true; announce('Shield acquired! Absorbs the next hit.'); }
        else if (pu.kind === 'star') { player.star = 60 * 8; announce('Star power! Temporary invincibility.'); }
      }
    }

    // hazards (spikes) - always damaging, not stompable
    for (const hz of level.hazards) {
      if (rectsOverlap(player, hz)) {
        if (player.star > 0) continue; // invincible - ignore all hazards this frame
        // once the shield is consumed, stop checking remaining hazards this
        // frame - otherwise overlapping two hazards at once could consume
        // the shield AND still cost a life in the same tick
        if (player.shielded) { player.shielded = false; player.invuln = 60; levelHitTaken = true; addShake(4); break; }
        loseLife();
        return;
      }
    }

    // enemies
    for (const en of level.enemies) {
      if (!en.alive) continue;
      const baseSpeed = (en.type === 'bat' ? 1.8 : en.type === 'spiky' ? 1.0 : en.type === 'boss' ? 0.6 : 1.5) * diff.enemySpeedMul;
      en.x += en.dir * baseSpeed;
      if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;
      if (en.type === 'bat') {
        en.phase += dt * 3;
        en.y = en.baseY + Math.sin(en.phase) * 30;
      } else {
        en.phase += dt * 6; // spin animation for spiky
      }

      if (rectsOverlap(player, en)) {
        // use this frame's starting Y (not a fixed pixel threshold) so a fast
        // fall can't be misjudged as a side hit just because vy is large
        const stompable = en.type !== 'spiky';
        const stomped = stompable && player.vy > 0 && (preMoveY + player.h) <= en.y + 10;
        const isBoss = en.type === 'boss';
        if (player.star > 0) {
          en.alive = false;
          score += isBoss ? 300 : 100;
          Audio1.stomp();
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 10, pal('star'), { life: 0.4, speed: 2 });
        } else if (stomped) {
          player.vy = -8;
          Audio1.stomp();
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 10, pal('goomba'), { life: 0.4, speed: 2 });
          if (isBoss) {
            en.hp = (en.hp || 1) - 1;
            score += 50;
            if (en.hp <= 0) { en.alive = false; score += 300; announce('Boss defeated!'); }
          } else {
            en.alive = false;
            score += 100;
          }
        } else if (player.shielded) {
          // stop checking further enemies this frame once the shield is
          // consumed, the same way the hazard loop does - don't rely on
          // invuln (set just below) to incidentally prevent a double-hit
          player.shielded = false;
          player.invuln = 60;
          levelHitTaken = true;
          addShake(4);
          break;
        } else {
          loseLife();
          return;
        }
      }
    }

    // flag
    if (rectsOverlap(player, level.flag)) {
      score += 500;
      const coinsThisLevel = coinCount - levelStartCoinCount;
      const gotAllCoins = level.totalCoins > 0 && coinsThisLevel >= level.totalCoins;
      let bonus = '';
      if (gotAllCoins) { score += 200; bonus += ' All-coins bonus +200!'; }
      if (!levelHitTaken) { score += 200; bonus += ' Flawless bonus +200!'; }
      let starsEarned = 1 + (gotAllCoins ? 1 : 0) + (!levelHitTaken ? 1 : 0);
      const starsKey = diffKey + '-' + levelIndex;
      if (!save.stars[starsKey] || save.stars[starsKey] < starsEarned) {
        save.stars[starsKey] = starsEarned;
        persistSave();
      }
      if (levelIndex < LEVELS.length - 1) {
        state = STATE.LEVEL_COMPLETE;
        Audio1.levelComplete();
        announce('Level ' + (levelIndex + 1) + ' complete!' + bonus + ' Score: ' + score + '. Press Enter for the next level.');
      } else {
        state = STATE.COMPLETE;
        Audio1.stopMusic();
        Audio1.win();
        announce('You beat all levels!' + bonus + ' Final score: ' + score + '. Press R, Space, Enter, or click to play again.');
      }
    }

    camX = Math.max(0, Math.min(level.width - CANVAS_W, player.x - CANVAS_W / 2));

    if (score > save.bestScores[diffKey]) { save.bestScores[diffKey] = score; persistSave(); }

    scoreEl.textContent = score;
    coinsEl.textContent = coinCount;
    livesEl.textContent = lives;
    updateBestDisplay(diffKey);
  }

  function update(dt) {
    updateParticles(dt);
    if (shake > 0) shake *= 0.85;
    if (shake < 0.1) shake = 0;

    if (state === STATE.START) {
      return;
    }
    if (state === STATE.PAUSED) {
      return;
    }
    if (state === STATE.LEVEL_COMPLETE || state === STATE.GAMEOVER || state === STATE.COMPLETE) {
      // advancing/restarting is handled by discrete input events (keydown/click/tap)
      // below, never by polling held-key state here - that was the source of a bug
      // where a still-held Space/R key instantly skipped these screens.
      return;
    }
    stepPhysics(dt);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function shadeColor(hex, amt) {
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + amt, g = ((num >> 8) & 0xff) + amt, b = (num & 0xff) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
    grad.addColorStop(0, level.theme);
    grad.addColorStop(1, shadeColor(level.theme, -45));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // mid-ground hill silhouettes for a little parallax depth
    ctx.fillStyle = shadeColor(level.theme, -25);
    for (let i = 0; i < 4; i++) {
      const hx = ((i * 300 - camX * 0.5) % (CANVAS_W + 300)) - 150;
      ctx.beginPath();
      ctx.ellipse(hx, CANVAS_H - 15, 160, 70, 0, Math.PI, 0, true);
      ctx.fill();
    }

    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 400 - camX * 0.3) % (CANVAS_W + 200)) - 100;
      drawCloud(cx, 60 + (i % 3) * 30);
    }
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 10, 22, 0, Math.PI * 2);
    ctx.arc(x + 40, y, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return; // blink while invulnerable
    const bob = player.onGround && player.vx !== 0 ? (player.animFrame === 1 ? 2 : 0) : 0;
    const px = player.x, py = player.y + bob;

    if (player.star > 0) {
      const hue = (Math.floor(Date.now() / 60) % 6) * 60;
      ctx.fillStyle = `hsl(${hue},90%,60%)`;
    } else {
      ctx.fillStyle = '#e60000';
    }
    ctx.fillRect(px, py, player.w, player.h * 0.5);
    ctx.fillStyle = player.star > 0 ? '#fff' : '#0000cd';
    ctx.fillRect(px, py + player.h * 0.5, player.w, player.h * 0.5 - (player.onGround ? bob : 0));

    // face
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(player.facing > 0 ? px + player.w - 10 : px, py + 4, 10, 10);

    // simple leg animation while running
    ctx.fillStyle = '#222';
    if (!player.onGround) {
      ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
      ctx.fillRect(px + player.w - 10, py + player.h - 10, 8, 10);
    } else if (player.vx !== 0) {
      if (player.animFrame === 0) {
        ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
        ctx.fillRect(px + player.w - 10, py + player.h - 8, 8, 8);
      } else {
        ctx.fillRect(px + 2, py + player.h - 8, 8, 8);
        ctx.fillRect(px + player.w - 10, py + player.h - 6, 8, 6);
      }
    } else {
      ctx.fillRect(px + 2, py + player.h - 6, 8, 6);
      ctx.fillRect(px + player.w - 10, py + player.h - 6, 8, 6);
    }

    if (player.shielded) {
      ctx.strokeStyle = '#00c8ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, player.w * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  function drawEnemy(en) {
    if (en.type === 'bat') {
      ctx.fillStyle = pal('bat');
      ctx.beginPath();
      ctx.ellipse(en.x + en.w / 2, en.y + en.h / 2, en.w / 2, en.h / 2.6, 0, 0, Math.PI * 2);
      ctx.fill();
      const wingFlap = Math.sin(en.phase * 3) * 8;
      ctx.fillStyle = pal('batWing');
      ctx.beginPath();
      ctx.moveTo(en.x, en.y + en.h / 2);
      ctx.lineTo(en.x - 10, en.y + en.h / 2 - wingFlap);
      ctx.lineTo(en.x, en.y + en.h / 2 + 6);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(en.x + en.w, en.y + en.h / 2);
      ctx.lineTo(en.x + en.w + 10, en.y + en.h / 2 - wingFlap);
      ctx.lineTo(en.x + en.w, en.y + en.h / 2 + 6);
      ctx.fill();
      ctx.fillStyle = pal('batEye');
      ctx.fillRect(en.x + 6, en.y + 8, 4, 4);
      ctx.fillRect(en.x + en.w - 10, en.y + 8, 4, 4);
    } else if (en.type === 'spiky') {
      const cx = en.x + en.w / 2, cy = en.y + en.h / 2, r = en.w / 2;
      ctx.strokeStyle = pal('spike');
      ctx.lineWidth = 3;
      const spikeCount = 8;
      for (let i = 0; i < spikeCount; i++) {
        const a = (Math.PI * 2 / spikeCount) * i + (en.phase || 0);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        ctx.lineTo(cx + Math.cos(a) * (r + 7), cy + Math.sin(a) * (r + 7));
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e63030';
      ctx.beginPath();
      ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI * 2);
      ctx.arc(cx + 4, cy - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (en.type === 'boss') {
      ctx.fillStyle = pal('goomba');
      ctx.fillRect(en.x, en.y, en.w, en.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(en.x + 8, en.y + 10, 10, 10);
      ctx.fillRect(en.x + en.w - 18, en.y + 10, 10, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(en.x + 11, en.y + 13, 4, 4);
      ctx.fillRect(en.x + en.w - 15, en.y + 13, 4, 4);
      ctx.fillStyle = pal('goombaBelly');
      ctx.fillRect(en.x, en.y + en.h - 10, en.w, 10);
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(en.x + 4, en.y);
      ctx.lineTo(en.x + 4, en.y - 12);
      ctx.lineTo(en.x + en.w * 0.3, en.y - 2);
      ctx.lineTo(en.x + en.w * 0.5, en.y - 14);
      ctx.lineTo(en.x + en.w * 0.7, en.y - 2);
      ctx.lineTo(en.x + en.w - 4, en.y - 12);
      ctx.lineTo(en.x + en.w - 4, en.y);
      ctx.closePath();
      ctx.fill();
      const hp = en.hp != null ? en.hp : 1;
      for (let i = 0; i < hp; i++) {
        ctx.fillStyle = '#e60000';
        ctx.beginPath();
        ctx.arc(en.x + en.w / 2 - (hp - 1) * 7 + i * 14, en.y - 24, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = pal('goomba');
      ctx.fillRect(en.x, en.y, en.w, en.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(en.x + 4, en.y + 6, 6, 6);
      ctx.fillRect(en.x + en.w - 10, en.y + 6, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(en.x + 6, en.y + 8, 2, 2);
      ctx.fillRect(en.x + en.w - 8, en.y + 8, 2, 2);
      ctx.fillStyle = pal('goombaBelly');
      ctx.fillRect(en.x, en.y + en.h - 6, en.w, 6);
    }
  }

  function drawHazard(hz) {
    ctx.fillStyle = pal('spike');
    const spikes = Math.floor(hz.w / 10);
    for (let i = 0; i < spikes; i++) {
      ctx.beginPath();
      ctx.moveTo(hz.x + i * 10, hz.y + hz.h);
      ctx.lineTo(hz.x + i * 10 + 5, hz.y);
      ctx.lineTo(hz.x + i * 10 + 10, hz.y + hz.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCheckpoint(cp) {
    ctx.fillStyle = cp.reached ? pal('checkpointOn') : pal('checkpointOff');
    ctx.fillRect(cp.x, cp.y, 4, cp.h);
    ctx.beginPath();
    ctx.moveTo(cp.x + 4, cp.y);
    ctx.lineTo(cp.x + 22, cp.y + 10);
    ctx.lineTo(cp.x + 4, cp.y + 20);
    ctx.closePath();
    ctx.fill();
  }

  function drawPowerup(pu) {
    ctx.save();
    ctx.translate(pu.x + pu.w / 2, pu.y + pu.h / 2);
    if (pu.kind === 'star') {
      ctx.fillStyle = pal('star');
      ctx.strokeStyle = '#b8860b';
      const spikes = 5, outerR = pu.w / 2, innerR = outerR / 2.4;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (Math.PI / spikes) * i - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = pal('shield');
      ctx.beginPath();
      ctx.arc(0, 0, pu.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#005f7a';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', 0, 1);
    }
    ctx.restore();
  }

  function drawWorld() {
    for (const p of level.platforms) {
      ctx.fillStyle = pal('ground');
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = pal('grass');
      ctx.fillRect(p.x, p.y, p.w, 8);
    }

    for (const hz of level.hazards) drawHazard(hz);
    if (level.checkpoint) drawCheckpoint(level.checkpoint);

    ctx.fillStyle = pal('coin');
    for (const coin of level.coins) {
      if (coin.collected) continue;
      ctx.beginPath();
      ctx.arc(coin.x + coin.w / 2, coin.y + coin.h / 2, coin.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = pal('coinStroke');
      ctx.stroke();
    }

    for (const pu of level.powerups) {
      if (!pu.collected) drawPowerup(pu);
    }

    for (const en of level.enemies) {
      if (en.alive) drawEnemy(en);
    }

    ctx.fillStyle = pal('flagPole');
    ctx.fillRect(level.flag.x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = pal('flagCloth');
    ctx.beginPath();
    ctx.moveTo(level.flag.x + 6, level.flag.y);
    ctx.lineTo(level.flag.x + 40, level.flag.y + 15);
    ctx.lineTo(level.flag.x + 6, level.flag.y + 30);
    ctx.closePath();
    ctx.fill();

    drawPlayer();
    drawParticles();
  }

  function drawOverlayBox(lines) {
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    let y = CANVAS_H / 2 - (lines.length - 1) * 18;
    lines.forEach((line, i) => {
      ctx.font = i === 0 ? '30px monospace' : '16px monospace';
      ctx.fillText(line, CANVAS_W / 2, y + i * 36);
    });
  }

  function draw() {
    difficultySel.disabled = (state === STATE.PLAYING || state === STATE.PAUSED || state === STATE.LEVEL_COMPLETE);
    ctx.save();
    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(sx, sy);

    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);
    drawWorld();
    ctx.restore();

    if (state === STATE.START) {
      {
        const dk = difficultySel.value;
        const starsLine = LEVELS.map((_, i) => {
          const n = save.stars[dk + '-' + i] || 0;
          return 'L' + (i + 1) + ':' + '★'.repeat(n) + '☆'.repeat(3 - n);
        }).join('   ');
        drawOverlayBox(['SUPER MAHSA BROS', 'Arrow keys / A-D to move, Space to jump', 'Stomp goombas, dodge spikes & spiky balls', 'Grab coins, hit checkpoints, reach the flag', starsLine, 'Press Enter/Space or click to start']);
      }
    } else if (state === STATE.PAUSED) {
      drawOverlayBox(['PAUSED', 'Press P to resume']);
    } else if (state === STATE.LEVEL_COMPLETE) {
      drawOverlayBox(['LEVEL ' + (levelIndex + 1) + ' COMPLETE!', 'Score: ' + score, 'Press Enter for next level']);
    } else if (state === STATE.GAMEOVER) {
      drawOverlayBox(['GAME OVER', 'Score: ' + score, 'Press R / Space / Enter or click to restart']);
    } else if (state === STATE.COMPLETE) {
      drawOverlayBox(['YOU WIN!', 'Final score: ' + score, 'Press R / Space / Enter or click to play again']);
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Main loop - fixed timestep for frame-rate independent physics
  // ---------------------------------------------------------------------
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    let frameTime = (ts - lastTime) / 1000;
    lastTime = ts;
    if (frameTime > 0.25) frameTime = 0.25; // avoid spiral of death on tab-back
    accumulator += frameTime;

    while (accumulator >= STEP) {
      update(STEP);
      accumulator -= STEP;
    }
    draw();
    requestAnimationFrame(loop);
  }

  announce('Press Enter/Space or click the game to start. Use the difficulty selector to choose a challenge level.');
  requestAnimationFrame(loop);
})();
</script>
