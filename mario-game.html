<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Mahsa Bros</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0f2a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    font-family: 'Baloo 2', 'Courier New', monospace;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    background: #0a0f2a;
    border: 4px solid #222;
  }
  #hud {
    color: #ffcf3d;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255, 207, 61, 0.6), 2px 2px 0 rgba(20, 10, 40, 0.8);
  }
  #msg {
    color: #cfe0ff;
    font-size: 16px;
    font-weight: 700;
    margin-top: 8px;
    text-shadow: 1px 1px 0 rgba(20, 10, 40, 0.8);
    min-height: 20px;
  }
  #titleScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0f2a;
    cursor: pointer;
    z-index: 10;
  }
  #titleFrame {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
    border: 4px solid #222;
  }
  #titleImg {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  #startBtn {
    position: absolute;
    left: 37%;
    top: 86%;
    width: 26%;
    height: 8%;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  #gameArea {
    display: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="titleScreen">
    <div id="titleFrame">
      <img id="titleImg" src="assets/title-night-alpaca.png" alt="Super Mahsa Bros title screen">
      <button id="startBtn" aria-label="Start Game"></button>
    </div>
  </div>
  <div id="gameArea">
    <div id="hud">Level <span id="levelNum">1</span>/10 &nbsp; Score: <span id="score">0</span> &nbsp; Coins: <span id="coins">0</span> &nbsp; Lives: <span id="lives">3</span></div>
    <canvas id="game" width="800" height="400"></canvas>
    <div id="msg">Arrow keys / A-D to move, Space or Up to jump. Stomp ghosts, grab coins, reach the flag! 10 levels await...</div>
  </div>
</div>

    hurt: 'assets/sounds/hurt.mp3',
    gameover: 'assets/sounds/gameover.mp3',
    win: 'assets/sounds/win.mp3',

  const sounds = {};
  for (const name in soundFiles) {
    const a = new Audio(soundFiles[name]);
    a.volume = 0.6;
    sounds[name] = a;
  }
  function playSound(name) {
    const base = sounds[name];
    if (!base) return;
    const a = base.cloneNode();
    a.volume = base.volume;
    a.play().catch(() => {});
  }

  const ctx = canvas.getContext('2d');

    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();

    const flag = { x: def.flagX, y: GROUND_Y - 200, w: 20, h: 200 };
    const stars = Array.from({ length: Math.round(def.worldWidth / 70) }, () => ({
      x: Math.random() * (def.worldWidth + 400),
      y: Math.random() * 220,
      r: Math.random() * 1.4 + 0.6,
      a: Math.random() * 0.5 + 0.4,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.02 + Math.random() * 0.04,
    }));
    const fireflies = Array.from({ length: Math.max(4, Math.round(def.worldWidth / 500)) }, () => ({
      x: Math.random() * def.worldWidth,
      y: 230 + Math.random() * 100,
      phase: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.5 ? '#fff4b0' : '#c8ffb0',
    }));
    // Decorate broad platforms (ground/plateaus) with a little swaying grass and
    // the occasional tiny flower along the top edge — purely cosmetic.
    for (const p of def.platforms) {
      if (p.w < 150) continue;
      const count = Math.max(2, Math.round(p.w / 90));
      p.decor = Array.from({ length: count }, () => ({
        off: 10 + Math.random() * (p.w - 20),
        flower: Math.random() < 0.28,
        hue: Math.floor(Math.random() * 3),
        phase: Math.random() * Math.PI * 2,
      }));
    }
    return { name: def.name, platforms: def.platforms, coins, enemies, flag, worldWidth: def.worldWidth, stars, fireflies, shootingStar: null, time: 0 };

    for (let i = 0; i < count; i++) {

      particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1, life: 26, maxLife: 26, color, size: 2 + Math.random() * 2, kind: 'dot' });
    }
  }

    }

  function spawnConfetti() {
    uiParticles = [];
    const colors = ['#ffcf3d', '#a8e6b0', '#4cc9f0', '#ff6fae', '#ffffff'];
    for (let i = 0; i < 60; i++) {
      uiParticles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 220,
        vy: 2 + Math.random() * 2,
        vx: (Math.random() - 0.5) * 1.5,
        size: 3 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  function updateParticles() {
    animTime++;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = uiParticles.length - 1; i >= 0; i--) {
      const p = uiParticles[i];
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > canvas.height + 20) uiParticles.splice(i, 1);
    }
    if (hitFlash > 0) hitFlash--;
    if (shake > 0) shake--;
  }

  function resetPlayer() {
    player.x = 50; player.y = GROUND_Y - 40;
    player.vx = 0; player.vy = 0; player.dead = false;
    camX = 0;
  }

  function loadLevel(index) {
    level = buildLevel(index);
    levelNumEl.textContent = index + 1;
    particles = [];
    resetPlayer();
  }

  function resetGame() {
    currentLevelIndex = 0;
    score = 0; coinCount = 0; lives = 3;
    levelComplete = false; gameOver = false; finished = false;
    loadLevel(0);
    msgEl.textContent = 'Arrow keys / A-D to move, Space or Up to jump. Stomp ghosts, grab coins, reach the flag! 10 levels await...';
  }

  function loseLife() {
    hitFlash = 14;
    shake = 10;
    lives--;
    if (lives <= 0) {
      gameOver = true;
      playSound('gameover');
      msgEl.textContent = 'Game Over! Press R to restart.';
    } else {
      playSound('hurt');
      resetPlayer();
    }
  }

  function nextLevel() {
    currentLevelIndex++;
    if (currentLevelIndex >= LEVELS.length) {
      finished = true;
      msgEl.textContent = 'You beat all 10 levels! Final score: ' + score + '. Press R to play again.';
    } else {
      loadLevel(currentLevelIndex);
      levelComplete = false;
      msgEl.textContent = 'Level ' + (currentLevelIndex + 1) + ': ' + level.name + ' — go!';
    }
  }

  function update() {
    updateParticles();

    if (gameOver || finished) {
      if (keys['KeyR']) resetGame();
      return;
    }
    if (levelComplete) {
      if (keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || keys['Enter']) nextLevel();
      return;
    }

    level.time++;
    for (const p of level.platforms) {
      if (!p.move) continue;
      const t = level.time * p.move.speed;
      if (p.move.axis === 'x') p.x = p.move.base + Math.sin(t) * p.move.range;
      else p.y = p.move.base + Math.sin(t) * p.move.range;
    }

    if (level.shootingStar) {
      const s = level.shootingStar;
      s.x += s.vx; s.y += s.vy; s.life--;
      if (s.life <= 0) level.shootingStar = null;
    } else if (Math.random() < 0.0025) {
      level.shootingStar = { x: camX + Math.random() * canvas.width * 0.6, y: 20 + Math.random() * 90, vx: 7, vy: 3.5, life: 30 };
    }

    const speed = 4;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -speed; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = speed; player.facing = 1; }
    else { player.vx = 0; }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
      player.vy = -12;
      player.onGround = false;
      playSound('jump');
    }

    player.vy += GRAVITY;
    if (player.vy > 18) player.vy = 18;

    player.x += player.vx;
    player.x = Math.max(0, Math.min(level.worldWidth - player.w, player.x));
    player.onGround = false;

    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        const prevBottom = player.y + player.h - player.vy;
        if (prevBottom <= p.y && player.vy >= 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }

    player.y += player.vy;
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          if (player.vy > 9) spawnDust(player.x + player.w / 2, player.y + player.h);
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    if (player.y > canvas.height + 100) {
      loseLife();
      return;
    }

    for (const coin of level.coins) {
      if (!coin.collected && rectsOverlap(player, coin)) {
        coin.collected = true;
        coinCount++;
        score += 50;
        playSound('coin');
        spawnBurst(coin.x + coin.w / 2, coin.y + coin.h / 2, '#ffe066', 8);
        spawnPopup(coin.x + coin.w / 2, coin.y, '+50', '#ffe066');
      }
    }

    for (const en of level.enemies) {
      if (!en.alive) continue;
      en.x += en.dir * 1.5;
      if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;

      if (rectsOverlap(player, en)) {
        const playerBottom = player.y + player.h;
        const stomped = player.vy > 0 && (playerBottom - en.y) < en.h * 0.6;
        if (stomped) {
          en.hp -= 1;
          player.vy = -8;
          score += 100;
          playSound('stomp');
          spawnBurst(en.x + en.w / 2, en.y + en.h / 2, '#c98a5a', 10);
          spawnPopup(en.x + en.w / 2, en.y, '+100', '#ffcf3d');
          if (en.hp <= 0) {
            en.alive = false;
            if (en.boss) {
              score += 300;
              spawnBurst(en.x + en.w / 2, en.y + en.h / 2, '#ff9a5c', 20);
              spawnPopup(en.x + en.w / 2, en.y - 20, '+300', '#ff9a5c');
              msgEl.textContent = 'Boss defeated! Bonus +300!';
            }
          } else if (en.boss) {
            msgEl.textContent = 'Boss hit! ' + en.hp + ' hit' + (en.hp === 1 ? '' : 's') + ' left...';
          }
        } else {
          loseLife();
          return;
        }
      }
    }

    if (rectsOverlap(player, level.flag)) {
      score += 500;
      playSound('win');
      spawnConfetti();
      if (currentLevelIndex >= LEVELS.length - 1) {
        finished = true;
        msgEl.textContent = 'You beat all 10 levels! Final score: ' + score + '. Press R to play again.';
      } else {
        levelComplete = true;
        msgEl.textContent = 'Level ' + (currentLevelIndex + 1) + ' complete! Score: ' + score + '. Press Space/Up to continue.';
      }
    }

    camX = Math.max(0, Math.min(level.worldWidth - canvas.width, player.x - canvas.width / 2));

    scoreEl.textContent = score;
    coinsEl.textContent = coinCount;
    livesEl.textContent = lives;
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, '#060a2a');
    sky.addColorStop(0.55, '#151c4a');
    sky.addColorStop(1, '#2c3570');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // stars (subtle parallax + gentle twinkle)
    for (const s of level.stars) {
      const sx = s.x - camX * 0.15;
      if (sx < -10 || sx > canvas.width + 10) continue;
      const tw = Math.max(0.15, Math.min(1, s.a + Math.sin(level.time * s.twinkleSpeed + s.phase) * 0.3));
      ctx.fillStyle = `rgba(255,255,255,${tw})`;
      ctx.beginPath();
      ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // a rare shooting star streaking by
    if (level.shootingStar) {
      const s = level.shootingStar;
      const sx = s.x - camX;
      const grad = ctx.createLinearGradient(sx, s.y, sx - 46, s.y - 23);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx, s.y);
      ctx.lineTo(sx - 46, s.y - 23);
      ctx.stroke();
    }

    // fireflies drifting low in the sky
    for (const f of level.fireflies) {
      const fx = f.x - camX + Math.sin(level.time * 0.02 + f.phase) * 22;
      if (fx < -10 || fx > canvas.width + 10) continue;
      const fy = f.y + Math.cos(level.time * 0.03 + f.phase) * 12;
      const flicker = 0.5 + Math.sin(level.time * 0.08 + f.phase * 2) * 0.4;
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 7);
      g.addColorStop(0, f.hue);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = Math.max(0.15, flicker);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fx, fy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // moon with soft glow, gently parallaxed
    const moonX = canvas.width - 100 - camX * 0.1;
    const moonY = 70;
    const glow = ctx.createRadialGradient(moonX, moonY, 4, moonX, moonY, 46);
    glow.addColorStop(0, 'rgba(255,250,220,0.55)');
    glow.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fdf6d8';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 22, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 6; i++) {
      const cx = ((i * 400 - camX * 0.3) % (canvas.width + 200)) - 100;
      drawCloud(cx, 60 + (i % 3) * 30);
    }
  }

  function drawCloud(x, y) {
    const puff = (px, py, r) => {
      const g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(1, 'rgba(200,210,240,0.55)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    };
    puff(x, y, 18);
    puff(x + 20, y - 10, 24);
    puff(x + 42, y, 18);
  }

  function drawGhost(en) {
    const { x, w, h } = en;
    const bob = Math.sin(en.x * 0.1 + en.y) * 3;
    const y = en.y + bob;
    const cx = x + w / 2;
    const blinking = Math.floor(animTime * 0.5 + en.x) % 210 < 8;

    // soft contact shadow, anchored to the ground so the ghost reads as floating
    ctx.fillStyle = 'rgba(10,12,35,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx, en.y + h * 1.06, w * 0.4, h * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = en.boss ? 'rgba(230,80,60,0.75)' : 'rgba(210,225,255,0.65)';
    ctx.shadowBlur = en.boss ? 16 : 9;

    // body: rounded dome top + wavy trailing bottom
    ctx.fillStyle = en.boss ? '#e6d8f2' : '#f5f7ff';
    ctx.globalAlpha = 0.94;
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.5);
    ctx.arc(cx, y + h * 0.5, w * 0.5, Math.PI, 0);
    ctx.lineTo(x + w, y + h * 0.86);
    ctx.quadraticCurveTo(x + w * 0.83, y + h, x + w * 0.67, y + h * 0.86);
    ctx.quadraticCurveTo(x + w * 0.5, y + h, x + w * 0.33, y + h * 0.86);
    ctx.quadraticCurveTo(x + w * 0.17, y + h, x, y + h * 0.86);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (en.boss) {
      // furrowed angry eyebrows
      ctx.strokeStyle = '#5a3a6e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.2, y + h * 0.32);
      ctx.lineTo(x + w * 0.42, y + h * 0.4);
      ctx.moveTo(x + w * 0.8, y + h * 0.32);
      ctx.lineTo(x + w * 0.58, y + h * 0.4);
      ctx.stroke();
    }

    // eyes (blink now and then)
    if (blinking) {
      ctx.strokeStyle = '#2a2a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.22, y + h * 0.48);
      ctx.lineTo(x + w * 0.42, y + h * 0.48);
      ctx.moveTo(x + w * 0.58, y + h * 0.48);
      ctx.lineTo(x + w * 0.78, y + h * 0.48);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#2a2a3a';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.32, y + h * 0.48, w * 0.1, h * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + w * 0.68, y + h * 0.48, w * 0.1, h * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + w * 0.29, y + h * 0.43, w * 0.03, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w * 0.65, y + h * 0.43, w * 0.03, 0, Math.PI * 2);
      ctx.fill();
    }
    if (en.boss) {
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '700 12px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HP ' + Math.max(en.hp, 0), cx, y - 8);
    }
    ctx.restore();
  }

  function drawAlpaca() {
    const { x, y, w, h, facing } = player;
    const cx = x + w / 2;
    const idle = player.vx === 0 && player.onGround;
    const breathe = idle ? Math.sin(animTime * 0.06) * 2 : 0;
    const earWiggle = Math.sin(animTime * 0.05) * 0.06;
    const blinkCycle = animTime % 170;
    const blinking = blinkCycle > 160 && blinkCycle < 168;

    ctx.save();

    // legs
    ctx.fillStyle = '#6dbf85';
    ctx.fillRect(x + w * 0.14, y + h * 0.82, w * 0.2, h * 0.2);
    ctx.fillRect(x + w * 0.66, y + h * 0.82, w * 0.2, h * 0.2);

    // fluffy body
    ctx.fillStyle = '#8fd9a0';
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.62, w * 0.58, h * 0.36 + breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a8e6b0';
    const tufts = [[-0.42, -0.08], [0.42, -0.08], [0, -0.3], [-0.5, 0.22], [0.5, 0.22]];
    for (const [dx, dy] of tufts) {
      ctx.beginPath();
      ctx.arc(cx + dx * w, y + h * 0.62 + dy * h, w * 0.24, 0, Math.PI * 2);
      ctx.fill();
    }

    // tail
    ctx.fillStyle = '#a8e6b0';
    ctx.beginPath();
    ctx.arc(x - facing * w * 0.05 + (facing > 0 ? 0 : w), y + h * 0.55, w * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // neck
    ctx.fillStyle = '#8fd9a0';
    ctx.beginPath();
    ctx.ellipse(cx + facing * w * 0.05, y + h * 0.18, w * 0.24, h * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // head
    const headCx = cx + facing * w * 0.14;
    const headCy = y - h * 0.02;
    ctx.beginPath();
    ctx.arc(headCx, headCy, w * 0.44, 0, Math.PI * 2);
    ctx.fill();

    // ears (gently wiggling)
    ctx.fillStyle = '#6dbf85';
    ctx.beginPath();
    ctx.ellipse(headCx - w * 0.3, headCy - h * 0.3, w * 0.13, h * 0.2, -0.4 - earWiggle, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headCx + w * 0.3, headCy - h * 0.3, w * 0.13, h * 0.2, 0.4 + earWiggle, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8f9e8';
    ctx.beginPath();
    ctx.ellipse(headCx - w * 0.3, headCy - h * 0.3, w * 0.06, h * 0.1, -0.4 - earWiggle, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headCx + w * 0.3, headCy - h * 0.3, w * 0.06, h * 0.1, 0.4 + earWiggle, 0, Math.PI * 2);
    ctx.fill();

    // muzzle
    ctx.fillStyle = '#fbeedd';
    ctx.beginPath();
    ctx.ellipse(headCx + facing * w * 0.18, headCy + h * 0.08, w * 0.26, h * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,150,180,0.55)';
    ctx.beginPath();
    ctx.arc(headCx - facing * w * 0.18, headCy + h * 0.1, w * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // eyes (with an occasional cute blink)
    if (blinking) {
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(headCx + facing * w * 0.02 - w * 0.09, headCy - h * 0.06);
      ctx.lineTo(headCx + facing * w * 0.02 + w * 0.09, headCy - h * 0.06);
      ctx.moveTo(headCx + facing * w * 0.32 - w * 0.07, headCy - h * 0.04);
      ctx.lineTo(headCx + facing * w * 0.32 + w * 0.07, headCy - h * 0.04);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(headCx + facing * w * 0.02, headCy - h * 0.06, w * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(headCx + facing * w * 0.32, headCy - h * 0.04, w * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(headCx + facing * w * 0.02 - facing * 1, headCy - h * 0.09, w * 0.035, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(headCx + facing * w * 0.32 - facing * 1, headCy - h * 0.07, w * 0.03, 0, Math.PI * 2);
      ctx.fill();
    }

    // nose
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(headCx + facing * w * 0.4, headCy + h * 0.08, w * 0.055, h * 0.04, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    drawBackground();
    ctx.save();
    const shakeX = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0;
    const shakeY = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0;
    ctx.translate(-camX + shakeX, shakeY);

    const flowerColors = ['#ff8fb3', '#ffe27a', '#bda8ff'];
    for (const p of level.platforms) {
      ctx.fillStyle = '#2e2140';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#2f6b46';
      ctx.fillRect(p.x, p.y, p.w, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(p.x, p.y + 8, p.w, 2);

      if (p.decor) {
        for (const d of p.decor) {
          const sway = Math.sin(level.time * 0.05 + d.phase) * 2;
          const bx = p.x + d.off;
          if (d.flower) {
            ctx.fillStyle = flowerColors[d.hue];
            for (const [px, py] of [[-3, -6], [3, -6], [0, -9], [-3, -10], [3, -10]]) {
              ctx.beginPath();
              ctx.arc(bx + px + sway * 0.3, p.y + py, 1.6, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.fillStyle = '#ffcf3d';
            ctx.beginPath();
            ctx.arc(bx + sway * 0.3, p.y - 7, 1.4, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.strokeStyle = '#3f8f5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bx - 3, p.y);
            ctx.lineTo(bx - 3 + sway, p.y - 9);
            ctx.moveTo(bx, p.y);
            ctx.lineTo(bx + sway, p.y - 12);
            ctx.moveTo(bx + 3, p.y);
            ctx.lineTo(bx + 3 + sway, p.y - 8);
            ctx.stroke();
          }
        }
      }
    }

    for (const coin of level.coins) {
      if (coin.collected) continue;
      const ccx = coin.x + coin.w / 2;
      const ccy = coin.y + coin.h / 2;
      const glow = ctx.createRadialGradient(ccx, ccy, 2, ccx, ccy, coin.w);
      glow.addColorStop(0, 'rgba(255,224,130,0.55)');
      glow.addColorStop(1, 'rgba(255,224,130,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(ccx, ccy, coin.w, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(ccx, ccy, coin.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();
    }

    for (const en of level.enemies) {
      if (!en.alive) continue;
      drawGhost(en);
    }

    ctx.fillStyle = '#c7d0e6';
    ctx.fillRect(level.flag.x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#ffcf3d';
    ctx.beginPath();
    ctx.moveTo(level.flag.x + 6, level.flag.y);
    ctx.lineTo(level.flag.x + 40, level.flag.y + 15);
    ctx.lineTo(level.flag.x + 6, level.flag.y + 30);
    ctx.closePath();
    ctx.fill();

    if (!player.dead) drawAlpaca();

    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      if (p.kind === 'text') {
        ctx.fillStyle = p.color;
        ctx.font = '700 14px "Baloo 2", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (hitFlash > 0) {
      ctx.fillStyle = `rgba(220,40,40,${(hitFlash / 14) * 0.35})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    for (const p of uiParticles) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(6,10,42,0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '800 34px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,207,61,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    } else if (finished) {
      ctx.fillStyle = 'rgba(6,10,42,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '800 34px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,207,61,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    } else if (levelComplete) {
      ctx.fillStyle = 'rgba(6,10,42,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcf3d';
      ctx.font = '800 30px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,207,61,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillText('LEVEL ' + currentLevelIndex + ' COMPLETE!', canvas.width / 2, canvas.height / 2 - 14);
      ctx.font = '700 16px "Baloo 2", sans-serif';
      ctx.shadowBlur = 0;
      ctx.fillText('Press Space / Up to continue', canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
